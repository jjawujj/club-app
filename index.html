<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2747C9">
<title>모임장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  /* 레이아웃: 휴대폰 폭(최대 480px) 한 줄 화면 + 위쪽 앱 바 + 아래쪽 탭 바. 넓은 화면에서는 가운데 정렬 */
  --bg:#F2F4F7; --frame:#E3E7EE; --surface:#FFFFFF; --sunk:#EDF0F5; --line:#D9DEE6; --fg:#161D29; --muted:#5A6475;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --ok:#0F7556; --ok-soft:#DCF2E9; --warn:#8F5600; --warn-soft:#FAEDD6;
  --bad:#B02236; --bad-soft:#FAE2E5; --info:#1F5F9E; --info-soft:#E0ECF8;
  --ticket:#FFF7E4; --ticket-line:#E3CF9F; --paper:#FFFFFF;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:12px; --w:480px; --bar:56px; --nav:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F131A; --frame:#080A0E; --surface:#171C26; --sunk:#1F2633; --line:#2D3646; --fg:#E6EAF1; --muted:#9AA3B3;
  --accent:#8BA2FF; --accent-ink:#0C1222; --accent-soft:#1F2A50;
  --ok:#55D0A2; --ok-soft:#123426; --warn:#F0B460; --warn-soft:#382811;
  --bad:#FF8B97; --bad-soft:#3B1B21; --info:#7DB6F0; --info-soft:#15283D;
  --ticket:#272315; --ticket-line:#4C432A; --paper:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F131A; --frame:#080A0E; --surface:#171C26; --sunk:#1F2633; --line:#2D3646; --fg:#E6EAF1; --muted:#9AA3B3;
  --accent:#8BA2FF; --accent-ink:#0C1222; --accent-soft:#1F2A50;
  --ok:#55D0A2; --ok-soft:#123426; --warn:#F0B460; --warn-soft:#382811;
  --bad:#FF8B97; --bad-soft:#3B1B21; --info:#7DB6F0; --info-soft:#15283D;
  --ticket:#272315; --ticket-line:#4C432A; --paper:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--frame)}
body{margin:0;background:var(--frame);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;letter-spacing:.01em;line-height:1.25}
h3{font-size:1rem;font-weight:600}
b{font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.84rem}
.center{text-align:center}
.lbl{display:block;font-size:.74rem;letter-spacing:.05em;color:var(--muted);font-weight:500}

/* 앱 틀 */
.app{max-width:var(--w);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--line)}
.appbar{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{height:var(--bar);display:flex;align-items:center;gap:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.appbar h1{font-size:1.08rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.appbar h1.brand{font-family:var(--f-display);font-weight:400;font-size:1.45rem;color:var(--accent)}
.iconbtn{appearance:none;border:0;background:none;color:var(--fg);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:24px;height:24px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.screen{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.screen.nonav{padding-bottom:40px}

.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--w),100%);z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{appearance:none;flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;font-weight:500;height:var(--nav);display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;position:relative}
.bnav svg{width:24px;height:24px}
.bnav button.on{color:var(--accent)}
.bnav .n{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--paper);font-size:.68rem;line-height:18px;text-align:center}
.fab{position:fixed;z-index:5;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));right:max(16px,calc((100vw - var(--w)) / 2 + 16px));display:flex;align-items:center;gap:6px;padding:12px 18px 12px 14px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;box-shadow:0 6px 18px rgba(20,30,60,.25);cursor:pointer}
.fab svg{width:22px;height:22px}

/* 공통 요소 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.sec{font-size:.86rem;font-weight:600;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.type{background:var(--accent-soft);color:var(--accent)}
.btn{appearance:none;font:inherit;font-weight:600;font-size:.92rem;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:20px;height:20px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn.block{width:100%;padding:13px 16px;font-size:1rem}
.link{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:500;padding:6px 0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
textarea{resize:vertical;font-size:.88rem;line-height:1.6}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input{flex:1;width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem}
.msg{padding:10px 12px;border-radius:10px;font-size:.9rem;background:var(--sunk)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--sunk)}
.banner.ok{background:var(--ok-soft)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--warn-soft)}
.confirm>span{font-size:.88rem;font-weight:500;margin-right:4px;flex-basis:100%}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.hl td{background:var(--warn-soft)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.9rem}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .who{display:grid;gap:2px;min-width:0;flex:1}
.plist .who .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--muted)}
.plist li.is-in{background:var(--ok-soft)}
.plist .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.bulk{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* 로그인 */
.login{min-height:100vh;min-height:100dvh;display:grid;align-content:center;gap:20px;padding:calc(32px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.logo{display:grid;justify-items:center;gap:8px;text-align:center;margin-bottom:8px}
.logo .mark{width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem}
.logo h1{font-family:var(--f-display);font-weight:400;font-size:2.2rem;color:var(--fg)}
.logo p{color:var(--muted);font-size:.9rem}
.form{display:grid;gap:14px}
.demo-acc{display:grid;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.acc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acc{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;gap:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.acc:hover{border-color:var(--accent)}
.acc span{font-size:.76rem;color:var(--muted)}

/* 홈 */
.hello{display:grid;gap:2px}
.todo{display:grid;gap:8px}
.todo-item{appearance:none;font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.todo-item::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--info);flex:none}
.todo-item.bad::before{background:var(--bad)}
.todo-item.warn::before{background:var(--warn)}
.todo-item span{flex:1;font-size:.92rem;font-weight:500}
.todo-item svg{width:18px;height:18px;color:var(--muted)}
.evlist{display:grid;gap:10px}
.ev-row{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.ev-row:hover{border-color:var(--accent)}
.ev-row.past{opacity:.75}
.datebox{display:grid;justify-items:center;padding:6px 0;border-radius:10px;background:var(--accent-soft);color:var(--accent);line-height:1.15}
.datebox small{font-size:.7rem;font-weight:600}
.datebox b{font-family:var(--f-mono);font-size:1.3rem;font-weight:500}
.ev-row .info{display:grid;gap:3px;min-width:0}
.ev-row .info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-row .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--muted)}

/* 행사 상세 */
.ev-head{display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.facts dt{font-size:.72rem;letter-spacing:.05em;color:var(--muted)}
.facts dd{margin:0;font-weight:500;font-size:.92rem}
.facts .wide{grid-column:1/-1}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.steps li{flex:1;display:grid;gap:4px;justify-items:center;font-size:.72rem;font-weight:500;color:var(--muted);text-align:center}
.steps li::before{content:"";height:4px;width:100%;border-radius:2px;background:var(--line)}
.steps li.done{color:var(--ok)}
.steps li.done::before{background:var(--ok)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.acct b{word-break:break-all}
.refund{display:grid;gap:8px;padding:12px;border-radius:10px;border:1px dashed var(--line)}
.big{font-family:var(--f-mono);font-size:1.7rem;font-weight:500}

/* 출석 QR 티켓 */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--ticket);border:1px solid var(--ticket-line);border-radius:var(--r);overflow:hidden}
.ticket-main{padding:16px;display:grid;gap:4px;align-content:center;min-width:0}
.ticket-main>b{font-size:1.2rem}
.ticket-qr{padding:12px;border-left:2px dashed var(--ticket-line);display:grid;place-items:center}
.ticket.tall{grid-template-columns:1fr}
.ticket.tall .ticket-qr{border-left:0;border-top:2px dashed var(--ticket-line);padding:22px}
.ticket.tall .ticket-main{text-align:center;justify-items:center}
.qr{background:var(--paper);padding:8px;border-radius:8px;line-height:0}
.qr img,.qr canvas{display:block;width:120px;height:120px}
.ticket.tall .qr img,.ticket.tall .qr canvas{width:220px;height:220px}
.qr.fallback{line-height:1.3;font-family:var(--f-mono);font-size:.7rem;color:#111;width:136px;word-break:break-all}
.stamp{justify-self:start;margin-top:6px;padding:3px 10px;border:2px solid var(--ok);color:var(--ok);border-radius:6px;font-weight:700;font-size:.85rem;transform:rotate(-2deg)}
.ticket.tall .stamp{justify-self:center}

/* 출석 관리 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:center}
.tile b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:.7rem}
.tile.alert b{color:var(--bad)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subtab{appearance:none;font:inherit;font-size:.86rem;font-weight:500;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;cursor:pointer}
.subtab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scanbtn{appearance:none;font:inherit;display:grid;justify-items:center;gap:6px;padding:26px 16px;border-radius:var(--r);border:2px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;width:100%}
.scanbtn svg{width:44px;height:44px}
.scanbtn small{font-weight:400;color:var(--muted);font-size:.8rem}
.late-qr{display:grid;gap:8px;justify-items:center;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.late-qr .qr img,.late-qr .qr canvas{width:220px;height:220px}
.code{font-size:1.6rem;letter-spacing:.18em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{appearance:none;font:inherit;color:inherit;display:grid;gap:4px;justify-items:start;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:.88rem}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calc td{white-space:normal}
.calc td:first-child{font-weight:600;white-space:nowrap}
.calc td:nth-child(2){color:var(--muted);font-size:.8rem}
.calc tr.total td{background:var(--accent-soft);font-weight:700}
.calc tr.total td:nth-child(2){color:var(--fg)}

/* 관리 · 내 정보 */
.menu{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.menu button{appearance:none;width:100%;font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.menu li:last-child button{border-bottom:0}
.menu .t{flex:1;display:grid;min-width:0}
.menu .t small{color:var(--muted);font-size:.8rem}
.menu .n{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:var(--paper);font-size:.74rem;line-height:22px;text-align:center}
.menu svg{width:18px;height:18px;color:var(--muted)}
.profile{display:flex;gap:14px;align-items:center}
.profile .avatar{width:56px;height:56px;font-size:1.4rem}
.profile .t{display:grid;gap:2px;min-width:0}
details.dev{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
details.dev summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:.9rem}
details.dev[open] summary{margin-bottom:12px}
details.dev .inner{display:grid;gap:12px}
.seg{border:0;padding:0;margin:0;display:grid;gap:8px}
.seg legend{font-size:.82rem;color:var(--muted);font-weight:500;margin-bottom:5px;padding:0}
.seg label{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.seg small{color:var(--muted);width:100%;padding-left:28px}
.rules{display:grid;gap:8px}
.rule-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem}
.rule-row input{width:68px}

/* 카메라 스캐너 (전체 화면) */
.scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
.scan-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(0,0,0,.6)}
.scan-top h3{flex:1;font-size:1rem}
.scan-top .iconbtn{color:#fff}
.scan-top .iconbtn:hover{background:rgba(255,255,255,.12)}
.scan-view{position:relative;overflow:hidden;display:grid;place-items:center}
.scan-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-view .frame{position:relative;width:min(64vw,260px);aspect-ratio:1;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanner:not(.live) .scan-view .frame{display:none}
.scan-bottom{display:grid;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.7);max-width:var(--w);width:100%;margin:0 auto}
.scan-bottom .hint{font-size:.88rem;color:#d8dbe2;text-align:center}

<div class="scanner" id="scanner" hidden>
  <div class="scan-top"><h3 id="scanTitle">QR 스캔</h3><button type="button" class="iconbtn" data-act="closeScanner" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="scan-view"><video id="scanVideo" playsinline muted></video><div class="frame"></div></div>

</div>

<script>
/* =====================================================================
   모임장부 · 시연용 프로토타입
   구조
   1) 기본 도우미        - 날짜, 금액 표시 같은 작은 함수
   2) 데이터(상태) 준비  - 계정, 학기 회원, 행사(환불 규칙 포함), 참가, 입출금, 장부, 설정
   3) 규칙 계산          - 권한, 환불 비율, 정산 공식, 늦은 출석 코드
   4) 화면 그리기        - 로그인, 홈, 출석, 관리, 내 QR, 내 정보
   5) 카메라 QR 스캔     - 휴대폰 카메라로 QR을 읽어 출석 처리
   6) 버튼 동작          - data-act 값에 맞는 함수 실행 → 데이터 변경 → 화면 다시 그리기
   실제 서비스에서는 2)가 서버 데이터베이스(Firebase/Supabase 등)에 있고,
   3)의 일부(로그인, 늦은 출석 코드 검증 등)는 서버에서 실행해야 조작을 막을 수 있습니다.
   ===================================================================== */

/* ---------- 1) 기본 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const uid = p => p + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const realToday = () => ymd(new Date());
const daysBetween = (from, to) => Math.round((new Date(to+'T00:00:00') - new Date(from+'T00:00:00')) / 86400000);
const WD = '일월화수목금토';
const dlabel = s => { if(!s) return ''; const d = new Date(s.slice(0,10)+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const timeLabel = ms => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dtLocal = ms => { const d = new Date(ms); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* 한글 초성 추출: '탁하늘' → 'ㅌㅎㄴ' (이름 검색에 사용) */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c <= 11171 ? CHO[Math.floor(c / 588)] : ch; }).join('');

/* 아이콘 (선 그림) */
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  home: svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  attend: svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 13l2 2 4-4"/>'),
  manage: svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  qr: svg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>'),
  me: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  scan: svg('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/>'),
  chev: svg('<path d="M9 5l7 7-7 7"/>'),
};

/* ---------- 2) 데이터(상태) ---------- */
const KEY = 'moimjangbu-app-v2';
const CLUB = '데이터경제 동아리';
const CUR = '2026-2', PREV = '2026-1';
const SEMS = {'2026-1':'2026년 1학기', '2026-2':'2026년 2학기'};
const ROLE_LABEL = {president:'회장', treasurer:'총무', staff:'운영진', member:'회원'};
const KIND_LABEL = {prepaid:'선납금', extra:'추가금', postpaid:'후불 정산금', refund:'환불'};
const METHOD = {qr:'QR 스캔', search:'이름 검색', late:'늦은 출석 QR', list:'명단 체크', import:'활동 출석자 불러오기', manual:'현장 추가'};
const NAMES = ['박서준','이하은','최도윤','정유나','한지호','김민지','강태현','윤서아','임준혁','오지민',
  '신예린','조현우','장소율','배도현','권나연','황민재','송하린','문시우','류채원','홍주원',
  '안다인','전승민','고은채','남궁윤','서지안','양현서','유태오','노아린','하준서','심가온',
  '차윤호','구서연','표지성','민하율','진수아','곽도경','엄지유','변재윤','탁하늘','석민서',
  '기윤아','방시원','추다온','도하람','라은서','마현빈','설지아','반서진','왕예준','편소희'];

let S;  // 앱 전체 데이터. 실제 서비스에서는 서버 데이터베이스에 저장됨

function seed(){
  const depts = ['경제학과','통계학과','경영학과','컴퓨터공학과','국어국문학과','사회학과','산업공학과','미디어학과'];
  const roleFor = i => i === 0 ? 'president' : i === 1 ? 'treasurer' : i <= 4 ? 'staff' : 'member';
  // 계정: 한 번 만들면 학기가 바뀌어도 유지
  const users = NAMES.map((name, i) => ({ id:'u'+i, name, pw:'1234',
    sid:`20${22 + i % 4}${String((i * 48271 + 12345) % 1000000).padStart(6,'0')}`,
    dept:depts[i % depts.length], phone:`010-${String(2000 + i*37).slice(-4)}-${String(5000 + i*91).slice(-4)}` }));
  // 학기 회원: 학기마다 다시 가입하므로 계정과 분리
  const ms = [];
  users.forEach((u, i) => {
    if (i <= 46) ms.push({userId:u.id, sem:PREV, role:roleFor(i), status:'approved', kakao:true, appliedAt:'2026-02-20'});
    if (i <= 44) ms.push({userId:u.id, sem:CUR, role:roleFor(i), status:'approved', kakao:i < 42, appliedAt:'2026-08-25'});
    if (i >= 47) ms.push({userId:u.id, sem:CUR, role:'member', status:'pending', kakao:false, appliedAt:'2026-10-2' + (i - 44)});
  });
  // 행사 (환불 규칙은 행사마다 rules 목록으로 저장)
  const base = {linked:null, lateUntil:null, locked:false, lockedBy:null, lockedAt:null, settlement:null};
  const events = [
    {...base, id:'e-open', name:'2026-2 개강총회', type:'prepaid', date:'2026-09-05', fee:30000, deadline:'2026-09-01', rules:[{days:5, rate:100}]},
    {...base, id:'e-oct', name:'할로윈 정기모임', type:'prepaid', date:'2026-10-26', fee:30000, deadline:'2026-10-23', rules:[{days:5, rate:100}]},
    {...base, id:'e-oct-after', name:'할로윈 정기모임 뒷풀이', type:'postpaid', date:'2026-10-26', fee:0, deadline:'2026-10-26', rules:[], linked:'e-oct'},
    {...base, id:'e-mt', name:'가을 MT', type:'prepaid', date:'2026-11-07', fee:50000, deadline:'2026-11-01', rules:[{days:7, rate:100}, {days:5, rate:50}]},
  ];
  // secret은 기기마다 같아야 노트북 화면의 늦은 출석 QR을 휴대폰으로 찍어도 맞음 (실제 서비스에서는 서버만 앎)
  S = { users, ms, events, parts:[], pays:[], ledger:[], session:null,
        settings:{ account:'카카오뱅크 3333-12-3456789 (예금주 이하은)', today:null }, secret:'moimjangbu-demo' };

  // 참가: 행사 × 사람 한 줄  /  입출금: 돈이 오간 기록
  const addPart = (eventId, i, o = {}) => { const p = {id:'p'+S.parts.length, eventId, userId:'u'+i, guest:null, status:'applied',
      appliedAt:o.appliedAt || '', attended:false, method:null, checkedBy:null, checkedAt:null, cancelReqAt:null, refundRate:null};
    if (o.att) Object.assign(p, {attended:true, method:o.method || 'qr', checkedBy:o.by || 'u2', checkedAt:o.at});
    S.parts.push(p); return p; };
  const addPay = (p, kind, amount, o = {}) => S.pays.push({id:'m'+S.pays.length, partId:p.id, kind, amount,
      payer:o.payer ?? user(p.userId).name, reportedAt:o.rep ?? null, confirmedAt:o.conf ?? null, confirmedBy:o.conf ? (o.by || 'u1') : null});

  // 개강총회: 정산까지 끝난 행사 (미납자 예시)
  const E0 = S.events[0];
  for (let i = 0; i <= 33; i++){
    const p = addPart(E0.id, i, {appliedAt:'2026-08-27', att: i !== 12 && i !== 27, at:`2026-09-05 18:${pad(10 + i)}`, by: i % 2 ? 'u2' : 'u3'});
    addPay(p, 'prepaid', 30000, {rep:'2026-08-28', conf:'2026-08-29'});
  }
  E0.locked = true; E0.lockedBy = 'u1'; E0.lockedAt = '2026-09-06 10:02';
  settleEvent(E0, 1050000, 'u1', '2026-09-06');
  S.pays.filter(m => m.kind === 'extra').forEach(m => {
    const who = S.parts.find(p => p.id === m.partId).userId;
    if (who === 'u9' || who === 'u30') return;                 // 미입금
    m.payer = user(who).name; m.reportedAt = '2026-09-07';
    if (who !== 'u21') { m.confirmedAt = '2026-09-08'; m.confirmedBy = 'u1'; }  // u21은 확인 대기
  });

  // 할로윈 정기모임: 오늘 진행하는 행사
  const E1 = S.events[1];
  const notYet = [5, 15, 36, 37, 38, 39];
  for (let i = 0; i <= 39; i++){
    const p = addPart(E1.id, i, {appliedAt:'2026-10-15', att: !notYet.includes(i), method: i % 7 === 0 ? 'search' : 'qr',
      at:`2026-10-26 18:${pad(5 + i)}`, by: i % 2 ? 'u2' : 'u3'});
    addPay(p, 'prepaid', 30000, {rep:'2026-10-16', conf:'2026-10-17'});
    if (i === 15){ // 7일 전에 취소 요청 → 100% 환불 완료
      Object.assign(p, {status:'refunded', cancelReqAt:'2026-10-19', refundRate:100});
      S.pays.push({id:'m'+S.pays.length, partId:p.id, kind:'refund', amount:30000, payer:null, reportedAt:null, confirmedAt:'2026-10-20', confirmedBy:'u1'});
    }
  }
  // 뒷풀이: 미리 참여 표시한 3명만 있음
  [2, 7, 9].forEach(i => addPart('e-oct-after', i, {appliedAt:'2026-10-24'}));

  // 가을 MT: 모집 중
  const E3 = S.events[3];
  [0,1,2,5,...Array.from({length:26}, (_, k) => k + 6)].forEach(i => {
    const p = addPart(E3.id, i, {appliedAt:'2026-10-20'});
    if ((i <= 2) || (i >= 6 && i <= 20)) addPay(p, 'prepaid', 50000, {rep:'2026-10-21', conf:'2026-10-22'});
    else if (i >= 21 && i <= 26) addPay(p, 'prepaid', 50000, {rep:'2026-10-24', payer: i === 22 ? '고은채MT' : i === 24 ? '서지안엄마' : NAMES[i]});
    if (i === 20) Object.assign(p, {status:'cancelRequested', cancelReqAt:'2026-10-24', refundRate:refundRate(E3, '2026-10-24')});
  });
  return S;
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function load(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e) {} return null; }

/* ---------- 3) 규칙 계산 ---------- */
const today = () => S.settings.today || realToday();   // 내 정보 → 개발자 옵션에서 기준일을 바꿀 수 있음
const stamp = () => { const d = new Date(); return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const user = id => S.users.find(u => u.id === id);
const ev = id => S.events.find(e => e.id === id);
const mem = (userId, sem = CUR) => S.ms.find(m => m.userId === userId && m.sem === sem);
const roleOf = userId => { const m = mem(userId); return m && m.status === 'approved' ? m.role : null; };
const isFinR = r => r === 'treasurer' || r === 'president';    // 입금 확인, 명단 확정, 정산
const isStaffR = r => r === 'staff' || isFinR(r);              // 행사 등록, 출석 체크
const me = () => user(ui.persona);
const myRole = () => roleOf(ui.persona);
const partsOf = eid => S.parts.filter(p => p.eventId === eid);
const isActive = p => p.status === 'applied' || p.status === 'cancelRequested';
const activeParts = eid => partsOf(eid).filter(isActive);
const partOf = (eid, userId) => S.parts.find(p => p.eventId === eid && p.userId === userId);
const paysOf = pid => S.pays.filter(m => m.partId === pid);
const prepaidOf = p => paysOf(p.id).find(m => m.kind === 'prepaid');
const chargeOf = p => paysOf(p.id).find(m => m.kind === 'extra' || m.kind === 'postpaid');
const pname = p => p.guest ? p.guest + ' (손님)' : user(p.userId).name;

/* 환불 비율: 행사까지 남은 일수가 규칙의 'n일 전까지'를 만족하는 첫 구간의 비율 */
function refundRate(e, onDate){
  const left = daysBetween(onDate, e.date);
  const rules = [...e.rules].sort((a, b) => b.days - a.days);
  for (const r of rules) if (left >= r.days) return r.rate;
  return 0;
}
function ruleText(e){
  if (e.type !== 'prepaid') return '선납금 없음';
  const rs = [...e.rules].sort((a, b) => b.days - a.days);
  return (rs.length ? rs.map(r => `${r.days}일 전까지 ${r.rate}%`).join(' · ') + ' · 그 이후 환불 없음' : '환불 없음') + ' · 불참 시 환불 없음';
}

/* 정산 공식
   확보금 = 확인된 선납금 − 환불액
   부족분 = 총지출 − 확보금
   부족분 > 0 → 1인당 = 부족분 ÷ N (1원 미만 버림), 버림 차액은 회비 부담
   부족분 ≤ 0 → 추가금 없음, 남은 금액은 회비로 이월
   후불형은 확보금이 0이므로 1인당 = 총지출 ÷ N */
function calcSettlement(e, spent){
  const parts = partsOf(e.id);
  const attendees = parts.filter(p => isActive(p) && p.attended);
  const N = attendees.length;
  let confirmedSum = 0, refundSum = 0, paidCount = 0;
  if (e.type === 'prepaid'){
    parts.forEach(p => paysOf(p.id).forEach(m => {
      if (m.kind === 'prepaid' && m.confirmedAt){ confirmedSum += m.amount; paidCount++; }
      if (m.kind === 'refund') refundSum += m.amount;
    }));
  }
  const secured = confirmedSum - refundSum;
  const short = spent - secured;
  let per = 0, gap = 0, carry = 0;
  if (short > 0 && N > 0){ per = Math.floor(short / N); gap = short - per * N; }
  else if (short <= 0) carry = -short;
  const unpaidAtt = e.type === 'prepaid' ? attendees.filter(p => !prepaidOf(p)?.confirmedAt) : [];
  return {N, memberN:attendees.filter(p => p.userId).length, guestN:attendees.filter(p => p.guest).length,
          confirmedSum, refundSum, paidCount, secured, short, per, gap, carry, attendees, unpaidAtt};
}
function settleEvent(e, spent, by, date){
  const {attendees, unpaidAtt, ...c} = calcSettlement(e, spent);
  e.settlement = {...c, spent, by, at:date};
  if (c.per > 0) attendees.forEach(p => S.pays.push({id:uid('m'), partId:p.id, kind:e.type === 'prepaid' ? 'extra' : 'postpaid',
      amount:c.per, payer:null, reportedAt:null, confirmedAt:null, confirmedBy:null}));
  if (c.gap > 0) S.ledger.push({date, desc:`${e.name} · 1인당 금액 버림 차액`, amount:-c.gap});
  if (c.carry > 0) S.ledger.push({date, desc:`${e.name} · 남은 금액 이월`, amount:c.carry});
}

/* 늦은 출석 코드: 30초마다 바뀌는 6자리. 직전 코드까지만 인정(최대 1분) */
const SLOT = 30000;
const slotNow = () => Math.floor(Date.now() / SLOT);
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); }
const lateToken = (eid, slot) => hashStr(`${eid}|${slot}|${S.secret}`);
const lateOpen = e => !!e && !!e.lateUntil && Date.now() < e.lateUntil;

function mark(p, method, by){ Object.assign(p, {attended:true, method, checkedBy:by || ui.persona, checkedAt:stamp()}); }
function unmark(p){ Object.assign(p, {attended:false, method:null, checkedBy:null, checkedAt:null}); }
function ensurePart(eid, userId){
  let p = partOf(eid, userId);
  if (p){ p.status = 'applied'; return p; }
  p = {id:uid('p'), eventId:eid, userId, guest:null, status:'applied', appliedAt:today(), attended:false, method:null,
       checkedBy:null, checkedAt:null, cancelReqAt:null, refundRate:null};
  S.parts.push(p); return p;
}

function checkLate(e, userId, code){
  if (!e) return {ok:false, msg:'알 수 없는 행사의 QR입니다.'};
  if (!lateOpen(e)) return {ok:false, msg:'늦은 출석이 마감되었습니다. 운영진에게 직접 확인을 요청하세요.'};
  if (e.locked) return {ok:false, msg:'출석이 이미 확정되었습니다.'};
  const s = slotNow();
  if (code !== lateToken(e.id, s) && code !== lateToken(e.id, s - 1))
    return {ok:false, msg:'만료되었거나 잘못된 코드입니다. 운영진 화면에 지금 떠 있는 QR을 다시 찍어 주세요.'};
  let p = partOf(e.id, userId);
  if (!p || !isActive(p)){
    if (e.type !== 'postpaid') return {ok:false, msg:'이 행사에 신청하지 않았습니다.'};
    p = ensurePart(e.id, userId);
  }
  if (p.attended) return {ok:false, msg:'이미 출석 처리되어 있습니다.'};
  mark(p, 'late', userId);
  return {ok:true, msg:`${e.name} 출석 완료 (${p.checkedAt.slice(11)})`};
}

function doScan(e, code){
  if (e.locked) return {tone:'bad', msg:'출석이 확정되어 더 이상 체크할 수 없습니다.'};
  const userId = (code || '').replace('MOIM:', '');
  const u = user(userId);
  if (!u || !roleOf(userId)) return {tone:'bad', msg:'이번 학기 회원의 QR이 아닙니다.'};
  let p = partOf(e.id, userId);
  const who = `${u.name} (${u.sid})`;
  if (!p || !isActive(p)){
    if (e.type !== 'postpaid') return {tone:'bad', msg:`${who} · 이 행사에 신청하지 않은 회원입니다.`};
    p = ensurePart(e.id, userId); mark(p, 'qr');
    return {tone:'ok', msg:`${who} · 현장 참여로 추가하고 출석 처리했습니다.`};
  }
  if (p.attended) return {tone:'warn', msg:`${who} · 이미 ${p.checkedAt.slice(11)}에 출석했습니다.`};
  mark(p, 'qr');
  if (e.type === 'prepaid' && !prepaidOf(p)?.confirmedAt)
    return {tone:'warn', msg:`${who} · 출석했지만 입금이 확인되지 않았습니다.`};
  return {tone:'ok', msg:`${who} · 출석 처리했습니다.`};
}

const pill = (label, tone = '') => `<span class="pill ${tone}">${esc(label)}</span>`;
const dataAttrs = d => Object.entries(d).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
const btn = (label, act, d = {}, cls = '') => `<button type="button" class="btn ${cls}" data-act="${act}" ${dataAttrs(d)}>${label}</button>`;
const card = (title, body) => `<section class="card"><h3>${title}</h3>${body}</section>`;
/* 확인 단계가 필요한 버튼: 한 번 누르면 질문이 나오고, '예'를 눌러야 실행 */
function confirmable(key, label, question, act, d, cls = 'primary'){
  if (ui.confirm === key) return `<div class="confirm"><span>${question}</span>${btn('예', act, d, 'primary sm')}${btn('아니요', 'unask', {}, 'ghost sm')}</div>`;
  return btn(label, 'ask', {key}, cls);
}
const dday = s => { const n = daysBetween(today(), s); return n > 0 ? `D-${n}` : n === 0 ? '오늘' : '종료'; };

function payPill(p){
  const m = prepaidOf(p);
  if (!m) return pill('미입금', 'bad');
  return m.confirmedAt ? pill('입금 확인', 'ok') : pill('입금 확인 중', 'info');
}
function myStatus(e, p){
  if (!p || p.status === 'cancelled') return {label:'미신청', tone:''};
  if (p.status === 'refunded') return {label:'환불 완료', tone:''};
  if (p.status === 'cancelRequested') return {label:'취소 요청 중', tone:'warn'};
  if (e.settlement){
    if (!p.attended) return {label:'불참', tone:''};
    const c = chargeOf(p);
    if (!c || c.confirmedAt) return {label:'정산 완료', tone:'ok'};
    if (c.reportedAt) return {label:'입금 확인 중', tone:'info'};
    return {label: e.type === 'prepaid' ? '추가금 미납' : '정산금 미납', tone:'bad'};
  }
  if (p.attended) return {label:'출석', tone:'ok'};
  if (e.type === 'prepaid'){
    const m = prepaidOf(p);
    if (!m) return {label:'입금 대기', tone:'bad'};
    return m.confirmedAt ? {label:'입금 확인', tone:'ok'} : {label:'입금 확인 중', tone:'info'};
  }
  return {label:'참여 예정', tone:'info'};
}
function counts(){
  return { pays: S.pays.filter(m => m.reportedAt && !m.confirmedAt && m.kind !== 'refund').length,
           cancels: S.parts.filter(p => p.status === 'cancelRequested').length,
           members: S.ms.filter(m => m.sem === CUR && m.status === 'pending').length,
           settle: S.events.filter(e => e.locked && !e.settlement).length };
}

}

function mountQR(root = document){
  root.querySelectorAll('[data-qr]').forEach(el => {
    el.innerHTML = '';
    if (window.QRCode){
      el.classList.remove('fallback');
      new QRCode(el, {text:el.dataset.qr, width:256, height:256, colorDark:'#111111', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
      el.removeAttribute('title');
    } else { el.classList.add('fallback'); el.textContent = el.dataset.qr; }
  });
}

function steps(e, p){
  const a = !!(p && isActive(p)), pp = a && prepaidOf(p), c = a && chargeOf(p);
  const list = e.type === 'prepaid'
    ? [['신청', a], ['입금', a && !!pp], ['입금 확인', a && !!pp?.confirmedAt], ['출석', a && p.attended], ['정산', a && !!e.settlement && (!p.attended || !c || !!c.confirmedAt)]]
    : [['참여', a], ['출석', a && p.attended], ['정산', a && !!e.settlement], ['입금 확인', a && !!c?.confirmedAt]];
  return `<ol class="steps">${list.map(([l, d]) => `<li class="${d ? 'done' : ''}">${l}</li>`).join('')}</ol>`;
}
function eventDetail(e){
  const p = partOf(e.id, ui.persona), st = myStatus(e, p);
  return `<section class="card ev-head">
    <div class="row">${pill(e.type === 'prepaid' ? '선납형' : '후불형', 'type')}${pill(st.label, st.tone)}</div>
    <dl class="facts">

      <div><dt>${e.type === 'prepaid' ? '참가비' : '정산'}</dt><dd>${e.type === 'prepaid' ? won(e.fee) + ' 선납' : '끝난 뒤 1/N'}</dd></div>
      ${e.type === 'prepaid' ? `<div><dt>신청 마감</dt><dd>${dlabel(e.deadline)}</dd></div>` : ''}
      <div class="wide"><dt>환불 규칙</dt><dd>${esc(ruleText(e))}</dd></div>
    </dl>
    ${steps(e, p)}
  </section>
  ${applyBlock(e, p)}${lateBlock(e, p)}${qrBlock(e, p)}${settleBlock(e, p)}`;
}
function applyBlock(e, p){
  const t = today();
  if (e.settlement) return '';
  if (!p || p.status === 'cancelled'){
    if (e.type === 'prepaid'){
      if (t > e.deadline || e.locked) return card('참가 신청', `<p class="muted">신청이 마감되었습니다.</p>`);
      return card('참가 신청', `<p>신청한 뒤 참가비 ${won(e.fee)}을 동아리 계좌로 입금합니다.</p>${btn('참가 신청', 'apply', {id:e.id}, 'primary block')}`);
    }
    return card('참여', `<p>뒷풀이는 대부분 현장에서 운영진이 명단에 넣습니다. 미리 표시해 두면 명단에 먼저 올라갑니다.</p>${btn('참여 예정으로 표시', 'apply', {id:e.id}, 'primary block')}`);
  }
  if (p.status === 'refunded'){
    const r = paysOf(p.id).find(m => m.kind === 'refund');
    return card('취소 완료', `<p>${won(r?.amount || 0)} 환불되었습니다 (요청일 기준 ${p.refundRate}%).</p>`);
  }
  if (p.status === 'cancelRequested'){
    const pp = prepaidOf(p);
    return card('취소 요청 중', `<p>${dlabel(p.cancelReqAt)}에 요청했습니다. 요청일 기준 환불 비율은 <b>${p.refundRate}%</b>${pp ? `, 예상 환불액은 <b>${won(Math.floor(pp.amount * p.refundRate / 100))}</b>` : ''}입니다.</p><p class="muted sm">총무·회장이 승인하면 환불됩니다.</p>`);
  }
  if (e.type === 'postpaid'){
    if (p.attended) return '';
    return card('참여 예정', `<p>현장에서 내 QR을 보여 주면 출석 처리됩니다.</p><div class="row">${confirmable('cx:' + e.id, '참여 취소', '참여 표시를 취소할까요?', 'cancelDirect', {id:e.id}, 'ghost')}</div>`);
  }
  const pp = prepaidOf(p);
  if (!pp) return card('참가비 입금', `
    <div class="acct"><div><span class="lbl">입금 계좌</span><b class="mono">${esc(S.settings.account)}</b></div>${btn('복사', 'copy', {text:S.settings.account}, 'ghost sm')}</div>
    <div class="acct"><div><span class="lbl">입금액</span><b class="mono">${won(e.fee)}</b></div></div>
    <label class="field"><span>입금자명 (통장에 찍히는 이름)</span><input id="payer" value="${esc(me().name)}"></label>
    ${btn('입금했어요', 'reportPay', {id:e.id}, 'primary block')}
    <div class="row">${confirmable('cx:' + e.id, '신청 취소', '입금 전이라 바로 취소됩니다. 취소할까요?', 'cancelDirect', {id:e.id}, 'ghost sm')}</div>
    <p class="muted sm">'입금했어요'를 누른 뒤에는 직접 취소할 수 없고 취소 요청만 할 수 있습니다.</p>`);
  let body = pp.confirmedAt
    ? `<p>${won(pp.amount)} 입금이 확인되었습니다 (${dlabel(pp.confirmedAt)}, 확인 ${esc(user(pp.confirmedBy)?.name)}).</p>`
    : `<p>${won(pp.amount)} 입금 표시를 했습니다 (입금자명 ${esc(pp.payer)}). 총무·회장이 통장 내역과 대조하고 있습니다.</p>`;
  if (!p.attended && t <= e.date && !e.locked){
    const rate = refundRate(e, t), amt = Math.floor(pp.amount * rate / 100);
    body += `<div class="refund"><div><span class="lbl">오늘(${dlabel(t)}) 취소를 요청하면</span><b>환불 ${rate}% · ${won(amt)}</b></div>
      <div class="row">${confirmable('cr:' + e.id, '취소 요청', `환불 ${rate}%(${won(amt)})로 요청할까요?`, 'requestCancel', {id:e.id}, 'ghost sm')}</div></div>`;
  }
  return card(pp.confirmedAt ? '입금 확인 완료' : '입금 확인 중', body);
}
function ticket(u, sub, p, tall){
  return `<section class="ticket ${tall ? 'tall' : ''}"><div class="ticket-main"><span class="lbl">${esc(sub)}</span><b>${esc(u.name)}</b>
    <span class="mono muted sm">${u.sid}</span>
    ${p && p.attended ? `<span class="stamp">출석 ${p.checkedAt ? p.checkedAt.slice(11) : ''} · ${METHOD[p.method] || ''}</span>` : `<p class="sm muted">입구에서 운영진에게 보여 주세요.</p>`}
    </div><div class="ticket-qr"><div class="qr" data-qr="MOIM:${u.id}"></div></div></section>`;
}
function qrBlock(e, p){
  if (!p || !isActive(p) || e.settlement) return '';
  return ticket(me(), '출석 QR · ' + e.name, p, false);
}
function lateBlock(e, p){
  if (!lateOpen(e) || e.settlement || e.locked) return '';
  if (p && isActive(p) && p.attended) return '';
  if (e.type === 'prepaid' && !(p && isActive(p))) return '';
  return card('늦게 도착했나요?', `<p class="sm">운영진 화면에 떠 있는 QR을 찍으면 출석됩니다. 마감 ${timeLabel(e.lateUntil)}</p>
    <button type="button" class="btn primary block" data-act="openScanner" data-mode="late" data-id="${e.id}">${ICON.scan}QR 찍어서 출석</button>

    <details><summary class="sm muted" style="cursor:pointer">카메라가 안 되면 코드로 입력</summary>
      <div class="row" style="margin-top:8px"><input id="lateCode" class="mono" maxlength="6" autocomplete="off" placeholder="QR 아래 6자리">${btn('인증', 'lateCheckin', {id:e.id}, 'ghost')}</div></details>`);
}
function settleBlock(e, p){
  if (!e.settlement || !p || !isActive(p)) return '';
  const s = e.settlement;
  if (!p.attended) return e.type === 'prepaid' ? card('정산', `<p>불참으로 처리되어 추가금이 없습니다. 불참자 선납금은 환불되지 않습니다.</p>`) : '';
  const c = chargeOf(p);
  const formula = e.type === 'prepaid' ? `(총지출 ${won(s.spent)} − 확보금 ${won(s.secured)}) ÷ ${s.N}명` : `총지출 ${won(s.spent)} ÷ ${s.N}명`;
  if (!c) return card('정산 결과', `<p>선납금으로 모두 충당되어 추가금이 없습니다.</p>`);
  let pay;
  if (c.confirmedAt) pay = `<p class="msg ok">${dlabel(c.confirmedAt)}에 입금이 확인되었습니다.</p>`;
  else if (c.reportedAt) pay = `<p class="msg">입금 표시를 했습니다. 총무·회장 확인을 기다리는 중입니다.</p>`;
  else pay = `<div class="acct"><div><span class="lbl">입금 계좌</span><b class="mono">${esc(S.settings.account)}</b></div>${btn('복사', 'copy', {text:S.settings.account}, 'ghost sm')}</div>
    ${btn('입금했어요', 'reportCharge', {id:c.id}, 'primary block')}`;
  return card(e.type === 'prepaid' ? '추가금 안내' : '정산금 안내', `<div><span class="lbl">${formula}, 1원 미만 버림</span><span class="big">${won(c.amount)}</span></div>${pay}`);
}

/* 내 QR */
VIEWS.qr = () => {
  const u = me();
  const mine = S.events.filter(e => !e.settlement).map(e => ({e, p:partOf(e.id, u.id)})).filter(x => x.p && isActive(x.p)).sort((a, b) => a.e.date.localeCompare(b.e.date));
  const late = mine.filter(x => lateOpen(x.e) && !x.e.locked && !x.p.attended);
  return `${ticket(u, `${SEMS[CUR]} ${CLUB}`, null, true)}
    <p class="muted sm center">모든 행사에서 같은 QR을 씁니다. 화면 밝기를 높이면 더 잘 찍힙니다.</p>
    ${late.map(({e}) => `<button type="button" class="todo-item" data-act="openScanner" data-mode="late" data-id="${e.id}"><span>${esc(e.name)} 늦은 출석 · QR 찍기</span>${ICON.chev}</button>`).join('')}
    ${mine.length ? `<h3 class="sec">참여하는 행사</h3><ul class="plist">${mine.map(({e, p}) => `<li><div class="who"><b>${esc(e.name)}</b><div class="meta">${dlabel(e.date)}</div></div>${p.attended ? pill('출석 ' + (p.checkedAt || '').slice(11), 'ok') : pill(dday(e.date), 'info')}</li>`).join('')}</ul>` : ''}`;
};

/* 내 정보 */
VIEWS.me = () => {

      <li><button type="button" data-act="logout">${ICON.back}<span class="t">로그아웃</span></button></li>
    </ul>
    <details class="dev"><summary>개발자 옵션 (시연용)</summary><div class="inner">
      <label class="field"><span>기준일 · 신청 마감과 환불 비율 계산에 쓰는 '오늘'</span><input type="date" id="demoToday" value="${today()}"></label>
      <div class="row">${btn('적용', 'setToday', {}, 'primary sm')}${btn('실제 오늘로', 'resetToday', {}, 'ghost sm')}</div>

    </div></details>`;
};

/* 운영진: 출석 관리 */
VIEWS.attend = () => {
  const evs = S.events.filter(e => !e.settlement).sort((a, b) => a.date.localeCompare(b.date));
  if (!evs.length) return `<div class="empty">출석을 관리할 행사가 없습니다.</div>`;
  if (!evs.find(e => e.id === ui.attEvent)) ui.attEvent = evs[0].id;
  const e = ev(ui.attEvent), r = myRole();
  const act = activeParts(e.id), att = act.filter(p => p.attended), miss = act.length - att.length;
  const subs = [['scan', 'QR 스캔'], ['search', '이름 검색'], ['late', '늦은 출석' + (lateOpen(e) ? ' ●' : '')], ['missing', `미출석 ${miss}`], ['count', '인원 대조 · 기록']];
  if (e.type === 'postpaid') subs.unshift(['roster', '명단 구성']);
  if (!subs.find(s => s[0] === ui.attTab)) ui.attTab = subs[0][0];
  let lock;
  if (e.locked) lock = `<div class="banner ok"><div><b>출석 확정됨</b><br><span class="sm">${esc(user(e.lockedBy)?.name)} · ${esc(e.lockedAt)} · 이 명단으로 정산합니다.</span></div>${isFinR(r) ? btn('확정 해제', 'unlock', {id:e.id}, 'ghost sm') : ''}</div>`;
  else if (isFinR(r)) lock = `<div class="banner"><div><b>출석 최종 확정</b><br><span class="sm">확정한 명단이 정산 인원(N)이 됩니다.</span></div>
    ${confirmable('lock:' + e.id, '확정하기', `출석 ${att.length}명으로 확정할까요?`, 'lockGo', {id:e.id}, 'primary sm')}</div>`;
  else lock = '';
  const body = {scan:scanBody, search:searchBody, late:lateBody, missing:missingBody, count:countBody, roster:rosterBody}[ui.attTab](e);
  return `<label class="field"><span>행사</span><select id="attEvent" data-change="attEvent">${evs.map(x => `<option value="${x.id}" ${x.id === e.id ? 'selected' : ''}>${esc(x.name)} · ${dlabel(x.date)}</option>`).join('')}</select></label>
  <div class="tiles">
    <div class="tile"><span class="lbl">${e.type === 'prepaid' ? '신청' : '명단'}</span><b>${act.length}</b></div>
    ${e.type === 'prepaid' ? `<div class="tile"><span class="lbl">입금 확인</span><b>${act.filter(p => prepaidOf(p)?.confirmedAt).length}</b></div>` : `<div class="tile"><span class="lbl">손님</span><b>${act.filter(p => p.guest).length}</b></div>`}
    <div class="tile"><span class="lbl">출석</span><b>${att.length}</b></div>
    <div class="tile ${miss ? 'alert' : ''}"><span class="lbl">미출석</span><b>${miss}</b></div>
  </div>
  ${lock}
  <div class="subtabs">${subs.map(([id, l]) => `<button type="button" class="subtab ${id === ui.attTab ? 'on' : ''}" data-act="attTab" data-id="${id}">${l}</button>`).join('')}</div>
  <div style="display:grid;gap:12px">${body}</div>`;
};
function personRow(e, p, method){
  const u = p.userId && user(p.userId);
  return `<li class="${p.attended ? 'is-in' : ''}"><div class="who"><b>${esc(pname(p))}</b><div class="meta">${u ? `<span class="mono">${u.sid}</span>` : ''}
    ${e.type === 'prepaid' ? payPill(p) : ''}${p.attended ? `<span>${p.checkedAt ? p.checkedAt.slice(11) : ''} ${METHOD[p.method] || ''}</span>` : ''}</div></div>
    ${e.locked ? '' : btn(p.attended ? '취소' : '출석', 'toggleAttend', {id:p.id, m:method}, p.attended ? 'ghost sm' : 'primary sm')}</li>`;
}
function scanBody(e){
  const recent = activeParts(e.id).filter(p => p.attended && p.checkedAt).sort((a, b) => b.checkedAt.localeCompare(a.checkedAt)).slice(0, 6);
  return `${e.locked ? '<p class="msg">출석이 확정되어 스캔할 수 없습니다.</p>' : `<button type="button" class="scanbtn" data-act="openScanner" data-mode="attend" data-id="${e.id}">${ICON.scan}<span>카메라로 학생 QR 스캔</span><small>연속으로 찍을 수 있습니다</small></button>`}
    <h3 class="sec">최근 출석</h3>
    ${recent.length ? `<ul class="plist">${recent.map(p => personRow(e, p, 'qr')).join('')}</ul>` : '<div class="empty">아직 없습니다.</div>'}`;
}
const matchU = (u, q) => !q || (/^\d+$/.test(q) ? u.sid.endsWith(q) : /^[ㄱ-ㅎ]+$/.test(q) ? cho(u.name).includes(q) : u.name.includes(q));
const matchP = (p, q) => p.guest ? (!q || p.guest.includes(q) || cho(p.guest).includes(q)) : matchU(user(p.userId), q);
function searchBody(e){
  return `<input id="attSearch" type="search" data-input="attSearch" value="${esc(ui.search)}" autocomplete="off" placeholder="이름, 초성(ㄱㅁㅈ), 학번 뒷자리" aria-label="출석 검색">
    <div id="searchList">${searchList(e)}</div>`;
}
function searchList(e){
  const q = ui.search.trim(), act = activeParts(e.id);
  const rows = act.filter(p => matchP(p, q)).sort((a, b) => (a.attended - b.attended) || pname(a).localeCompare(pname(b), 'ko'));
  let h = rows.length ? `<ul class="plist">${rows.map(p => personRow(e, p, 'search')).join('')}</ul>` : `<div class="empty">명단에서 찾지 못했습니다.</div>`;
  if (e.type === 'postpaid' && q){
    const extra = S.users.filter(u => roleOf(u.id) && !act.find(p => p.userId === u.id) && matchU(u, q));
    if (extra.length) h += `<h3 class="sec" style="margin-top:12px">명단에 없는 회원</h3><ul class="plist">${extra.map(u => `<li><div class="who"><b>${esc(u.name)}</b><div class="meta mono">${u.sid}</div></div>${e.locked ? '' : btn('추가·출석', 'addMember', {uid:u.id}, 'ghost sm')}</li>`).join('')}</ul>`;
  }
  return h;
}
function lateBody(e){
  const lateN = activeParts(e.id).filter(p => p.method === 'late').length;
  if (!lateOpen(e)) return `<p class="sm">늦게 오는 사람을 위해 30초마다 바뀌는 QR을 이 화면에 띄워 둡니다. 학생이 직접 찍어 출석하고, 사진으로 공유된 QR은 1분이 지나면 쓸 수 없습니다.</p>
      ${e.lateUntil ? `<p class="sm muted">${timeLabel(e.lateUntil)}에 마감되었습니다.</p>` : ''}
      ${e.locked ? '<p class="msg">출석이 확정되어 열 수 없습니다.</p>' : `<label class="field"><span>마감 시각</span><input type="datetime-local" id="lateUntilIn" value="${dtLocal(Date.now() + 3600000)}"></label>
      ${btn('늦은 출석 열기', 'lateSet', {id:e.id}, 'primary block')}`}`;
  return `<div class="late-qr"><div class="qr" id="lateQR" data-qr="MOIM-LATE:${e.id}:${lateToken(e.id, slotNow())}"></div>
      <b class="mono code" id="lateCodeText">${lateToken(e.id, slotNow())}</b><span class="sm muted">다음 코드까지 <b id="lateCountdown" class="mono">--</b> · 마감 ${timeLabel(e.lateUntil)}</span></div>
    <div class="row">${btn('+30분', 'lateExtend', {id:e.id}, 'ghost sm')}${btn('지금 마감', 'lateClose', {id:e.id}, 'ghost sm')}</div>
    <label class="field"><span>마감 시각 변경 (끝나는 시각이 바뀌면 언제든)</span><div class="row"><input type="datetime-local" id="lateUntilIn" value="${dtLocal(e.lateUntil)}">${btn('변경', 'lateSet', {id:e.id}, 'ghost sm')}</div></label>
    <p class="sm muted">늦은 출석으로 들어온 사람 ${lateN}명</p>`;
}
function missingBody(e){
  const miss = activeParts(e.id).filter(p => !p.attended);
  return `<p class="sm muted">${e.type === 'prepaid' ? '신청했지만 아직 출석하지 않은 사람입니다. 현장에 있으면 바로 체크하세요.' : '미리 참여 표시했지만 아직 출석하지 않은 사람입니다.'}</p>
    ${miss.length ? `<ul class="plist">${miss.map(p => personRow(e, p, 'list')).join('')}</ul>` : '<div class="empty">미출석자가 없습니다.</div>'}`;
}
function countBody(e){
  const att = activeParts(e.id).filter(p => p.attended);
  let res = '';
  if (ui.headcount !== '' && ui.headcount != null){
    const h = +ui.headcount, a = att.length;
    if (h === a) res = `<p class="msg ok">앱 출석 ${a}명과 실제 머릿수 ${h}명이 일치합니다.</p>`;
    else if (a > h) res = `<p class="msg bad">앱 출석이 실제보다 ${a - h}명 많습니다. 아래 기록에서 '늦은 출석 QR'로 들어온 사람부터 확인하세요.</p>`;
    else res = `<div class="msg warn"><p>실제 인원이 ${h - a}명 더 많습니다. 출석하지 않은 사람이 있습니다.</p><div class="row" style="margin-top:6px">${btn('미출석자 보기', 'attTab', {id:'missing'}, 'ghost sm')}</div></div>`;
  }
  const log = att.slice().sort((x, y) => ((y.method === 'late') - (x.method === 'late')) || (x.checkedAt || '').localeCompare(y.checkedAt || ''));
  return `<label class="field"><span>운영진이 센 실제 머릿수</span><div class="row"><input id="headcount" type="number" inputmode="numeric" min="0" value="${esc(ui.headcount)}">${btn('대조', 'headcount', {}, 'primary')}</div></label>
    ${res}
    <h3 class="sec">출석 기록 ${att.length}명</h3>
    <div class="tbl"><table><thead><tr><th>이름</th><th>방법</th><th>체크</th><th>시각</th></tr></thead><tbody>
    ${log.map(p => `<tr class="${p.method === 'late' ? 'hl' : ''}"><td>${esc(pname(p))}</td><td>${METHOD[p.method] || '-'}</td>
      <td>${p.method === 'late' ? '본인' : esc(user(p.checkedBy)?.name || '-')}</td><td class="mono">${p.checkedAt ? esc(p.checkedAt.slice(11)) : '-'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function rosterBody(e){
  const L = e.linked && ev(e.linked), act = activeParts(e.id);
  return `${L ? card(`${esc(L.name)} 출석자 불러오기`, `<p class="sm muted">활동 출석자 ${activeParts(L.id).filter(p => p.attended).length}명을 한 번에 넣고, 오지 않은 사람만 뺍니다.</p>${e.locked ? '' : btn('불러오기', 'importLinked', {id:e.id}, 'primary')}`) : ''}
    ${card('손님 추가', `<p class="sm muted">앱 계정 없이 이름만 등록합니다. 정산 후 손님이 직접 내고, 총무·회장이 바로 입금 확인합니다.</p>

    <h3 class="sec">현재 명단 ${act.length}명 · 출석 ${act.filter(p => p.attended).length}명</h3>

VIEWS.create = () => {

      <label><input type="radio" name="ftype" id="f-post" value="postpaid" data-change="ftype"> <b>후불형</b><small>끝난 뒤 총액 1/N · 손님 참여 가능 · 뒷풀이용</small></label>

      <div id="f-rules">${ruleRow(5, 100)}</div>
      <div class="row">${btn('구간 추가', 'addRule', {}, 'ghost sm')}</div>
      <p class="msg sm" id="rulePreview"></p></div>
    <label class="field" data-post hidden><span>연결된 활동 (출석자 불러오기용)</span><select id="f-linked"><option value="">없음</option>
      ${S.events.filter(x => x.type === 'prepaid').map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
    <p id="f-err" class="msg bad" hidden></p>
    <button type="submit" class="btn primary block">행사 등록</button>
  </form>`;
};
function readRules(){
  const out = [];
  for (const r of document.querySelectorAll('#f-rules .rule-row')){
    const days = parseInt(r.querySelector('[data-rule="days"]').value, 10), rate = parseInt(r.querySelector('[data-rule="rate"]').value, 10);
    if (!(days >= 0) || !(rate >= 0 && rate <= 100)) return null;
    out.push({days, rate});
  }
  return out;
}
function updateRulePreview(){
  const el = $('#rulePreview'); if (!el) return;
  const rules = readRules();
  el.textContent = rules === null ? '일수는 0 이상, 비율은 0~100으로 입력하세요.' : '회원에게 이렇게 보입니다: ' + ruleText({type:'prepaid', rules});
}

  ${pend.length ? `<div class="bulk"><label class="check" style="align-items:center"><input type="checkbox" data-change="selAll" data-group="pay"><span>모두 선택</span></label>${btn('선택 확인', 'confirmSel', {}, 'primary sm')}</div>
    <ul class="plist">${pend.map(m => { const p = S.parts.find(x => x.id === m.partId), nm = pname(p);
      return checkRow('pay', m.id, nm, `<b>${esc(nm)}</b><div class="meta"><span>${esc(ev(p.eventId).name)} · ${KIND_LABEL[m.kind]}</span><span>입금자명 ${esc(m.payer)}</span>${p.userId && m.payer !== user(p.userId).name ? pill('이름 다름', 'warn') : ''}</div>`,
        `<div style="display:grid;gap:4px;justify-items:end"><span class="amt">${won(m.amount)}</span>${btn('확인', 'confirmPay', {id:m.id}, 'ghost sm')}</div>`); }).join('')}</ul>` : '<div class="empty">확인할 입금이 없습니다.</div>'}
  <h3 class="sec">취소 요청 ${cx.length}건</h3>
  ${cx.length ? `<ul class="plist">${cx.map(p => { const e = ev(p.eventId), pp = prepaidOf(p), ok = pp && pp.confirmedAt, amt = pp ? Math.floor(pp.amount * p.refundRate / 100) : 0;
    return `<li style="flex-wrap:wrap"><div class="who"><b>${esc(pname(p))}</b><div class="meta"><span>${esc(e.name)}</span><span>${dlabel(p.cancelReqAt)} 요청 · ${daysBetween(p.cancelReqAt, e.date)}일 전</span><span>환불 ${p.refundRate}%</span></div></div>
      <span class="amt">${won(amt)}</span>
      <div class="row" style="flex-basis:100%;justify-content:flex-end">${ok ? btn(amt ? '환불 완료 처리' : '취소 처리 (환불 없음)', 'approveCancel', {id:p.id}, 'primary sm') : '<span class="sm muted">입금 확인 먼저</span>'}${btn('거절', 'rejectCancel', {id:p.id}, 'ghost sm')}</div></li>`; }).join('')}</ul>` : '<div class="empty">취소 요청이 없습니다.</div>'}

    return `<li><div class="who"><b>${esc(pname(p))}</b><div class="meta"><span>${esc(ev(p.eventId).name)} · ${KIND_LABEL[m.kind]}</span>${m.reportedAt ? pill('입금 표시함', 'info') : pill('미입금', 'bad')}</div></div>

/* 총무·회장: 정산 */
VIEWS.settle = () => {
  const evs = [...S.events].sort((a, b) => b.date.localeCompare(a.date));
  if (!ev(ui.settleEvent)) ui.settleEvent = evs[0].id;
  const e = ev(ui.settleEvent);
  const chips = evs.map(x => { const st = x.settlement ? ['정산 완료', 'ok'] : x.locked ? ['정산 가능', 'info'] : ['출석 확정 전', ''];
    return `<button type="button" class="chip ${x.id === e.id ? 'on' : ''}" data-act="pickSettle" data-id="${x.id}"><b>${esc(x.name)}</b>${pill(st[0], st[1])}</button>`; }).join('');
  let body;
  if (e.settlement) body = settleResult(e);
  else if (!e.locked) body = `<div class="banner"><div><b>출석을 먼저 확정해야 합니다</b><br><span class="sm">확정된 출석 명단이 정산 인원(N)이 됩니다.</span></div>${btn('출석 관리로', 'nav', {tab:'attend', sub:'', ev:e.id}, 'ghost sm')}</div>`;
  else body = `<label class="field"><span>실제 총지출 (원)</span><input id="spent" type="number" inputmode="numeric" min="0" step="1" data-input="spent" value="${esc(ui.spent[e.id] ?? '')}" placeholder="예: 1500000"></label>
    <div id="settlePreview">${settlePreview(e)}</div>`;
  return `<div class="chips">${chips}</div>
    <p class="sm muted">${e.type === 'prepaid' ? '선납형: 지출이 확보금보다 크면 초과분을 참석자 1/N, 남으면 회비로 이월' : '후불형: 총지출을 참석자(손님 포함) 1/N'} · 1원 미만 버림</p>${body}`;
};
function calcTable(e, c, spent){
  const L = [];
  if (e.type === 'prepaid'){
    L.push(['확인된 선납금', `${c.paidCount}건`, won(c.confirmedSum)]);
    if (c.refundSum) L.push(['환불', '취소 승인분', '−' + won(c.refundSum)]);
    L.push(['확보금', '선납금 − 환불', won(c.secured)]);
    L.push(['총지출', '', won(spent)]);
    L.push([c.short > 0 ? '부족분' : '남은 금액', '총지출 − 확보금', won(Math.abs(c.short))]);
  } else L.push(['총지출', '', won(spent)]);
  L.push(['정산 인원', e.type === 'prepaid' ? '확정 출석자 (운영진 포함)' : `회원 ${c.memberN} + 손님 ${c.guestN}`, c.N + '명']);
  let total;
  if (c.short > 0 && c.N > 0){
    L.push(['걷히는 금액', `${won(c.per)} × ${c.N}`, won(c.per * c.N)]);
    L.push(['버림 차액', '회비에서 부담', c.gap ? '−' + won(c.gap) : '0원']);
    total = ['1인당', `${won(c.short)} ÷ ${c.N} = ${(c.short / c.N).toLocaleString('ko-KR', {maximumFractionDigits:3})} → 1원 미만 버림`, won(c.per)];
  } else total = ['1인당 추가금', `${won(c.carry)} 회비로 이월`, '0원'];
  return `<div class="tbl calc"><table><tbody>${L.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}
    <tr class="total"><td>${total[0]}</td><td>${total[1]}</td><td class="num">${total[2]}</td></tr></tbody></table></div>`;
}
function settlePreview(e){
  const spent = parseInt(ui.spent[e.id], 10);
  if (!(spent > 0)) return `<p class="muted sm">총지출을 입력하면 계산 과정이 바로 나옵니다.</p>`;
  const c = calcSettlement(e, spent);
  if (!c.N) return `<p class="msg bad">출석자가 없어 정산할 수 없습니다.</p>`;
  const warn = c.unpaidAtt.length ? `<p class="msg warn">출석했지만 선납금 입금이 확인되지 않은 사람: ${c.unpaidAtt.map(p => esc(pname(p))).join(', ')}</p>` : '';
  const q = c.per > 0 ? `1인당 ${won(c.per)}으로 확정할까요? 확정 후에는 바꿀 수 없습니다.` : `추가금 없이 ${won(c.carry)}을 이월할까요?`;
  return `<div style="display:grid;gap:10px">${warn}${calcTable(e, c, spent)}${confirmable('settle:' + e.id, '정산 확정', q, 'settleGo', {id:e.id}, 'primary block')}</div>`;
}
function noticeText(e){
  const s = e.settlement, names = partsOf(e.id).filter(p => isActive(p) && p.attended).map(p => pname(p).replace(' (손님)', '(손님)'));
  const lines = [`[${e.name} 정산 안내]`];
  if (e.type === 'prepaid'){
    lines.push(`총지출 ${won(s.spent)} / 확보한 선납금 ${won(s.secured)}`);
    if (s.per > 0){
      lines.push(`부족한 ${won(s.short)}을 참석자 ${s.N}명이 나눕니다.`);
      lines.push(`1인당 추가금: ${won(s.per)}` + (s.gap ? ` (1원 미만 버림, 차액 ${won(s.gap)}은 회비에서 부담)` : ''));
    } else lines.push(`선납금으로 모두 충당되어 추가금은 없습니다. 남은 ${won(s.carry)}은 회비로 이월합니다.`);
  } else {
    lines.push(`총지출 ${won(s.spent)} ÷ ${s.N}명`);
    lines.push(`1인당: ${won(s.per)}` + (s.gap ? ` (1원 미만 버림, 차액 ${won(s.gap)}은 회비에서 부담)` : ''));
  }
  if (s.per > 0){ lines.push(`입금 계좌: ${S.settings.account}`); lines.push(`입금 후 앱에서 '입금했어요'를 눌러 주세요.`); }
  lines.push('', `대상자 (${names.length}명): ${names.join(', ')}`);
  return lines.join('\n');
}
function settleResult(e){
  const s = e.settlement;
  const charges = partsOf(e.id).flatMap(p => paysOf(p.id).filter(m => m.kind === 'extra' || m.kind === 'postpaid').map(m => ({m, p})));
  const paid = charges.filter(x => x.m.confirmedAt).length;
  return `<div class="tiles">
      <div class="tile"><span class="lbl">1인당</span><b style="font-size:1rem">${won(s.per)}</b></div>
      <div class="tile"><span class="lbl">인원</span><b>${s.N}</b></div>
      <div class="tile"><span class="lbl">${s.carry ? '이월' : '회비 부담'}</span><b style="font-size:1rem">${s.carry ? '+' + won(s.carry) : s.gap ? '−' + won(s.gap) : '0원'}</b></div>
      <div class="tile ${charges.length - paid ? 'alert' : ''}"><span class="lbl">입금</span><b style="font-size:1rem">${paid}/${charges.length}</b></div></div>
    <p class="sm muted">${dlabel(s.at)} ${esc(user(s.by)?.name)} 확정</p>
    ${calcTable(e, s, s.spent)}
    ${card('카톡방 안내문', `<textarea id="notice" rows="8" readonly>${esc(noticeText(e))}</textarea>${btn('안내문 복사', 'copy', {target:'notice'}, 'primary block')}`)}
    ${charges.length ? `<h3 class="sec">입금 현황</h3><ul class="plist">${charges.map(({m, p}) => `<li class="${m.confirmedAt ? 'is-in' : ''}"><div class="who"><b>${esc(pname(p))}</b><div class="meta"><span class="mono">${won(m.amount)}</span>
      ${m.confirmedAt ? pill('확인', 'ok') : m.reportedAt ? pill('입금 표시함', 'info') : pill('미입금', 'bad')}</div></div>${m.confirmedAt ? '' : btn(p.guest ? '바로 확인' : '확인', 'confirmPay', {id:m.id}, 'ghost sm')}</li>`).join('')}</ul>` : ''}`;
}

/* ---------- 5) 카메라 QR 스캔 ---------- */
const SC = {stream:null, raf:0, mode:null, eid:null, last:'', lastAt:0, canvas:null};
function scanOptions(e){
  const act = activeParts(e.id).filter(p => p.userId), notYet = act.filter(p => !p.attended);
  const others = S.users.filter(u => roleOf(u.id) && !act.find(p => p.userId === u.id));
  const opt = u => `<option value="MOIM:${u.id}">${esc(u.name)} · ${u.sid}</option>`;
  return `${notYet.length ? `<optgroup label="출석 전 신청자">${notYet.map(p => opt(user(p.userId))).join('')}</optgroup>` : ''}
    ${others.length ? `<optgroup label="${e.type === 'prepaid' ? '신청하지 않은 회원' : '명단에 없는 회원'}">${others.map(opt).join('')}</optgroup>` : ''}`;
}
function updateScanCount(){
  const el = $('#scanCount');
  if (SC.mode === 'attend'){ const act = activeParts(SC.eid); el.textContent = `출석 ${act.filter(p => p.attended).length} / ${act.length}명`; }
  else el.textContent = '';
}
function showScanRes(res){ $('#scanRes').innerHTML = `<p class="res ${res.tone}">${esc(res.msg)}</p>`; }
async function openScanner(mode, eid){
  Object.assign(SC, {mode, eid, last:'', lastAt:0});
  const el = $('#scanner'); el.hidden = false; el.classList.remove('live');
  $('#scanTitle').textContent = mode === 'attend' ? `${ev(eid).name} · 출석 스캔` : '늦은 출석 QR 찍기';
  $('#scanHint').textContent = mode === 'attend' ? '학생 휴대폰의 QR을 네모 안에 맞춰 주세요' : '운영진 화면의 QR을 네모 안에 맞춰 주세요';
  $('#scanRes').innerHTML = ''; $('#scanAlt').innerHTML = ''; updateScanCount();
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('이 환경에서는 카메라를 쓸 수 없습니다.');
    if (!window.jsQR) throw new Error('QR 인식 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    SC.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    if ($('#scanner').hidden){ stopStream(); return; }
    const v = $('#scanVideo'); v.srcObject = SC.stream; await v.play();
    el.classList.add('live'); tickScan();
  } catch(err){ scanFallback(err); }
}
function scanFallback(err){
  const why = err && err.name === 'NotAllowedError' ? '카메라 권한이 거부되었습니다.' : (err && err.message) || '카메라를 열 수 없습니다.';
  $('#scanHint').textContent = why + ' 아래에서 직접 처리할 수 있습니다.';
  $('#scanAlt').innerHTML = SC.mode === 'attend'
    ? `<select id="scanWho" aria-label="출석 처리할 회원">${scanOptions(ev(SC.eid))}</select>${btn('출석 처리', 'scanManual', {}, 'primary block')}`
    : `<input id="lateCode2" class="mono" maxlength="6" autocomplete="off" placeholder="QR 아래 6자리 코드">${btn('출석 인증', 'lateManual', {}, 'primary block')}`;
}
function stopStream(){ cancelAnimationFrame(SC.raf); if (SC.stream) SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; }
function closeScanner(){ stopStream(); $('#scanVideo').srcObject = null; $('#scanner').hidden = true; $('#scanner').classList.remove('live'); render(); }
function tickScan(){
  if (!SC.stream) return;
  const v = $('#scanVideo');
  if (v.readyState >= 2 && v.videoWidth){
    const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w);
    const c = SC.canvas || (SC.canvas = document.createElement('canvas')); c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(v, 0, 0, w, h);
    const code = jsQR(x.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'});
    if (code && code.data) onScanned(code.data);
  }
  SC.raf = requestAnimationFrame(tickScan);
}
function onScanned(data){
  const now = Date.now();
  if (data === SC.last && now - SC.lastAt < 2500) return;   // 같은 QR을 연달아 읽지 않도록
  SC.last = data; SC.lastAt = now;
  let res;
  if (SC.mode === 'attend') res = data.startsWith('MOIM:') ? doScan(ev(SC.eid), data) : {tone:'bad', msg:'모임장부 출석 QR이 아닙니다.'};
  else {
    const m = data.match(/^MOIM-LATE:([^:]+):([A-Z0-9]{6})$/);
    const r = m ? checkLate(ev(m[1]), ui.persona, m[2]) : {ok:false, msg:'늦은 출석 QR이 아닙니다.'};
    ui.lateMsg = r; res = {tone:r.ok ? 'ok' : 'bad', msg:r.msg};
  }
  showScanRes(res); updateScanCount(); save();
  try { if (navigator.vibrate) navigator.vibrate(res.tone === 'ok' ? 60 : [40, 40, 40]); } catch(e) {}
  if (SC.mode === 'late' && res.tone === 'ok') setTimeout(closeScanner, 1200);
}

/* 글자를 입력할 때 (화면 전체가 아니라 필요한 부분만 다시 그림) */
const INP = {
  attSearch: t => { ui.search = t.value; $('#searchList').innerHTML = searchList(ev(ui.attEvent)); },
  spent: t => { ui.spent[ui.settleEvent] = t.value; if (ui.confirm) ui.confirm = null; $('#settlePreview').innerHTML = settlePreview(ev(ui.settleEvent)); },
  rules: () => updateRulePreview(),
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t); });
document.addEventListener('change', e => { const k = e.target.dataset?.change; if (k && CHG[k]) CHG[k](e.target); });
document.addEventListener('input', e => { const k = e.target.dataset?.input; if (k && INP[k]) INP[k](e.target); });
document.addEventListener('submit', e => { e.preventDefault(); const k = e.target.dataset.submit; if (k && ACT[k]) ACT[k](); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scanner').hidden) closeScanner(); });

/* 1초마다: 늦은 출석 QR 남은 시간 표시, 30초마다 새 코드 */
setInterval(() => {
  const cd = $('#lateCountdown'); if (!cd) return;
  const e = ev(ui.attEvent);
  if (!lateOpen(e)){ render(); return; }
  cd.textContent = Math.ceil((SLOT - Date.now() % SLOT) / 1000) + '초';
  const s = slotNow();
  if (s !== ui.lastSlot){ ui.lastSlot = s; const q = $('#lateQR'); q.dataset.qr = `MOIM-LATE:${e.id}:${lateToken(e.id, s)}`; mountQR(q.parentNode); $('#lateCodeText').textContent = lateToken(e.id, s); }
}, 1000);

S = load() || seed();
ui.persona = S.session && user(S.session) ? S.session : null;
render();
</script>
