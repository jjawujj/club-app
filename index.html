<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>모임장부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* 레이아웃: 상단 고정 바(앱 이름 · 시연 인물 전환) + 가로 탭 + 최대 1000px 단일 작업 영역 */
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF2; --line:#D6DCE5; --fg:#161D29; --muted:#5A6475;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --ok:#0F7556; --ok-soft:#DCF2E9; --warn:#8F5600; --warn-soft:#FAEDD6;
  --bad:#B02236; --bad-soft:#FAE2E5; --info:#1F5F9E; --info-soft:#E0ECF8;
  --ticket:#FFF7E4; --ticket-line:#E3CF9F; --paper:#FFFFFF;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171C26; --sunk:#1F2633; --line:#2D3646; --fg:#E6EAF1; --muted:#9AA3B3;
  --accent:#8BA2FF; --accent-ink:#0C1222; --accent-soft:#1F2A50;
  --ok:#55D0A2; --ok-soft:#123426; --warn:#F0B460; --warn-soft:#382811;
  --bad:#FF8B97; --bad-soft:#3B1B21; --info:#7DB6F0; --info-soft:#15283D;
  --ticket:#272315; --ticket-line:#4C432A; --paper:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C26; --sunk:#1F2633; --line:#2D3646; --fg:#E6EAF1; --muted:#9AA3B3;
  --accent:#8BA2FF; --accent-ink:#0C1222; --accent-soft:#1F2A50;
  --ok:#55D0A2; --ok-soft:#123426; --warn:#F0B460; --warn-soft:#382811;
  --bad:#FF8B97; --bad-soft:#3B1B21; --info:#7DB6F0; --info-soft:#15283D;
  --ticket:#272315; --ticket-line:#4C432A; --paper:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h2,h3,h4{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.75rem;letter-spacing:.01em}
h3{font-size:1.02rem;font-weight:600}
h4{font-size:.9rem;font-weight:600;color:var(--muted);margin-top:1.4rem;margin-bottom:.5rem}
p{margin:0}
b{font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.84rem}
.lbl{display:block;font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-weight:500}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.tabs-in,main{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand strong{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--accent)}
.brand span{font-size:.8rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{font-size:.78rem;color:var(--muted)}
.who select{max-width:220px}
.tabs{overflow-x:auto;border-top:1px solid var(--line)}
.tabs-in{display:flex;gap:2px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:1.3em;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--paper);font-size:.72rem;line-height:1.3em;text-align:center}
main{padding-block:22px 80px;display:grid;gap:18px}

/* 공통 요소 */
.view-head{display:grid;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.type{background:var(--accent-soft);color:var(--accent)}
.btn{appearance:none;font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:500;padding:0;cursor:pointer;justify-self:start}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;font-family:var(--f-body);font-size:.88rem;line-height:1.6}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{padding:10px 12px;border-radius:8px;font-size:.9rem;background:var(--sunk)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--sunk)}
.banner.ok{background:var(--ok-soft)}
.banner.warn{background:var(--warn-soft)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--fg)}
.confirm>span{font-size:.88rem;font-weight:500;margin-right:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.hl td{background:var(--warn-soft)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* 행사 목록 */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ev-card{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;gap:6px;align-content:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.ev-card:hover{border-color:var(--accent)}
.ev-card>b{font-size:1.05rem}
.ev-card-top{display:flex;justify-content:space-between;align-items:center}

/* 행사 상세 */
.ev-head{display:grid;gap:12px}
.ev-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.74rem;letter-spacing:.06em;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.steps li{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--sunk);color:var(--muted);font-size:.84rem;font-weight:500}
.steps li span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:.74rem;font-family:var(--f-mono)}
.steps li.done{background:var(--ok-soft);color:var(--ok)}
.steps li.done span{background:var(--ok);color:var(--paper)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.acct b{word-break:break-all}
.refund{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px dashed var(--line)}
.demo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.demo .lbl{margin-right:4px}

/* 출석 티켓: 행사 입장권처럼 절취선이 있는 카드 */
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--ticket);border:1px solid var(--ticket-line);border-radius:var(--r);overflow:hidden}
.ticket-main{padding:16px;display:grid;gap:4px;align-content:center;min-width:0}
.ticket-main>b{font-size:1.25rem}
.ticket-qr{padding:14px;border-left:2px dashed var(--ticket-line);display:grid;place-items:center}
.qr{background:var(--paper);padding:8px;border-radius:6px;line-height:0}
.qr img,.qr canvas{display:block;width:140px;height:140px}
.qr.fallback{line-height:1.3;font-family:var(--f-mono);font-size:.7rem;color:#111;width:156px;word-break:break-all}
.stamp{justify-self:start;margin-top:6px;padding:3px 10px;border:2px solid var(--ok);color:var(--ok);border-radius:6px;font-weight:700;font-size:.85rem;transform:rotate(-2deg)}

/* 출석 관리 */
.att-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile.alert b{color:var(--bad)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subtab{appearance:none;font:inherit;font-size:.88rem;font-weight:500;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;cursor:pointer}
.subtab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scan{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
.viewfinder{aspect-ratio:1;max-width:100%;border-radius:var(--r);background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.viewfinder span{position:absolute;inset:18%;border:3px solid var(--accent);border-radius:12px;opacity:.7}
.scan-side{display:grid;gap:10px;min-width:0}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist li>div:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.plist li.is-in{background:var(--ok-soft)}
.late-on{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.late-qr{display:grid;gap:8px;justify-items:center;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.late-qr .qr img,.late-qr .qr canvas{width:190px;height:190px}
.code{font-size:1.6rem;letter-spacing:.18em}
.late-ctl,.late-off{display:grid;gap:10px;align-content:start;max-width:560px}
.count{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* 정산 */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{appearance:none;font:inherit;color:inherit;display:grid;gap:4px;justify-items:start;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calc td:first-child{font-weight:600}
.calc td:nth-child(2){color:var(--muted);white-space:normal;min-width:160px}
.calc tr.total td{background:var(--accent-soft);font-weight:700}
.calc tr.total td:nth-child(2){color:var(--fg)}
.big{font-family:var(--f-mono);font-size:1.6rem;font-weight:500}

/* 행사 등록 */
.form{display:grid;gap:14px;max-width:620px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{border:0;padding:0;margin:0;display:grid;gap:8px}
.seg legend{font-size:.82rem;color:var(--muted);font-weight:500;margin-bottom:4px;padding:0}
.seg label{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.seg small{color:var(--muted);width:100%;padding-left:24px}
.rules{display:grid;gap:8px}
.rule-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rule-row input{width:72px}

/* 시연 순서 */
.guide{display:grid;gap:12px;counter-reset:none}
.guide .card p{max-width:68ch}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:640px){
  .scan{grid-template-columns:1fr}
  .viewfinder{max-width:200px}
  .late-on{grid-template-columns:1fr}
  .ticket{grid-template-columns:1fr}
  .ticket-qr{border-left:0;border-top:2px dashed var(--ticket-line)}
  h2{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><strong>모임장부</strong><span id="semLabel"></span></div>
    <div class="who">
      <label for="persona">시연 인물</label>
      <select id="persona" data-change="persona"></select>
      <span id="whoRole"></span>
      <span id="todayPill"></span>
    </div>
  </div>
  <nav class="tabs" aria-label="메뉴"><div class="tabs-in" id="tabs"></div></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =====================================================================
   모임장부 · 시연용 프로토타입
   구조
   1) 기본 도우미        - 날짜, 금액 표시 같은 작은 함수
   2) 데이터(상태) 준비  - 표 8개: 계정, 학기 회원, 행사, 환불 규칙(행사 안), 참가, 입출금, 장부, 설정
   3) 규칙 계산          - 권한, 환불 비율, 정산 공식, 늦은 출석 코드
   4) 화면 그리기        - 탭마다 HTML을 만들어 넣음
   5) 버튼 동작          - data-act 값에 맞는 함수 실행 → 데이터 변경 → 화면 다시 그리기
   실제 앱에서는 2)가 서버 데이터베이스(Firebase/Supabase 등)에 있고,
   3)의 일부(늦은 출석 코드 검증 등)는 서버에서 실행해야 조작을 막을 수 있습니다.
   ===================================================================== */

/* ---------- 1) 기본 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const uid = p => p + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const realToday = () => ymd(new Date());
const daysBetween = (from, to) => Math.round((new Date(to+'T00:00:00') - new Date(from+'T00:00:00')) / 86400000);
const WD = '일월화수목금토';
const dlabel = s => { if(!s) return ''; const d = new Date(s.slice(0,10)+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const timeLabel = ms => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dtLocal = ms => { const d = new Date(ms); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* 한글 초성 추출: '탁하늘' → 'ㅌㅎㄴ' (이름 검색에 사용) */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c <= 11171 ? CHO[Math.floor(c / 588)] : ch; }).join('');

/* ---------- 2) 데이터(상태) ---------- */
const KEY = 'moimjangbu-demo-v1';
const CUR = '2026-2', PREV = '2026-1';
const SEMS = {'2026-1':'2026년 1학기', '2026-2':'2026년 2학기'};
const ROLE_LABEL = {president:'회장', treasurer:'총무', staff:'운영진', member:'회원'};
const KIND_LABEL = {prepaid:'선납금', extra:'추가금', postpaid:'후불 정산금', refund:'환불'};
const METHOD = {qr:'QR 스캔', search:'이름 검색', late:'늦은 출석 QR', list:'명단 체크', import:'활동 출석자 불러오기', manual:'현장 추가'};
const NAMES = ['박서준','이하은','최도윤','정유나','한지호','김민지','강태현','윤서아','임준혁','오지민',
  '신예린','조현우','장소율','배도현','권나연','황민재','송하린','문시우','류채원','홍주원',
  '안다인','전승민','고은채','남궁윤','서지안','양현서','유태오','노아린','하준서','심가온',

        settings:{ account:'카카오뱅크 3333-12-3456789 (예금주 이하은, 예시)', today:null },

  // 표 ⑥ 참가: 행사 × 사람 한 줄  /  표 ⑦ 입출금: 돈이 오간 기록

    S.parts.push(p); return p; };
  const addPay = (p, kind, amount, o = {}) => S.pays.push({id:'m'+S.pays.length, partId:p.id, kind, amount,
      payer:o.payer ?? user(p.userId).name, reportedAt:o.rep ?? null, confirmedAt:o.conf ?? null, confirmedBy:o.conf ? (o.by || 'u1') : null});

  // 개강총회: 정산까지 끝난 행사 (미납자 예시용)

  E0.locked = true; E0.lockedBy = 'u1'; E0.lockedAt = '2026-09-06 10:02';

  S.pays.filter(m => m.kind === 'extra').forEach(m => {

      at:`2026-10-26 18:${pad(5 + i)}`, by: i % 2 ? 'u2' : 'u3'});

  }
  // 뒷풀이: 미리 참여 표시한 3명만 있음
  [2, 7, 9].forEach(i => addPart('e-oct-after', i, {appliedAt:'2026-10-24'}));

  // 가을 MT: 모집 중 (입금 확인, 취소 요청 시연용)
  const E3 = S.events[3];
  [0,1,2,5,...Array.from({length:26}, (_, k) => k + 6)].forEach(i => {
    const p = addPart(E3.id, i, {appliedAt:'2026-10-20'});
    if ((i <= 2) || (i >= 6 && i <= 20)) addPay(p, 'prepaid', 50000, {rep:'2026-10-21', conf:'2026-10-22'});
    else if (i >= 21 && i <= 26) addPay(p, 'prepaid', 50000, {rep:'2026-10-24', payer: i === 22 ? '고은채MT' : i === 24 ? '서지안엄마' : NAMES[i]});
    if (i === 20) Object.assign(p, {status:'cancelRequested', cancelReqAt:'2026-10-24', refundRate:refundRate(E3, '2026-10-24')});
  });
  return S;
}

/* ---------- 3) 규칙 계산 ---------- */
const today = () => S.settings.today || realToday();   // 시연 기준일 (장부·설정에서 바꿀 수 있음)
const stamp = () => { const d = new Date(); return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const user = id => S.users.find(u => u.id === id);
const ev = id => S.events.find(e => e.id === id);
const mem = (userId, sem = CUR) => S.ms.find(m => m.userId === userId && m.sem === sem);
const roleOf = userId => { const m = mem(userId); return m && m.status === 'approved' ? m.role : null; };
const isFinR = r => r === 'treasurer' || r === 'president';    // 입금 확인, 명단 확정, 정산
const isStaffR = r => r === 'staff' || isFinR(r);              // 행사 등록, 출석 체크

const myRole = () => roleOf(ui.persona);
const partsOf = eid => S.parts.filter(p => p.eventId === eid);
const isActive = p => p.status === 'applied' || p.status === 'cancelRequested';
const activeParts = eid => partsOf(eid).filter(isActive);
const partOf = (eid, userId) => S.parts.find(p => p.eventId === eid && p.userId === userId);
const paysOf = pid => S.pays.filter(m => m.partId === pid);
const prepaidOf = p => paysOf(p.id).find(m => m.kind === 'prepaid');
const chargeOf = p => paysOf(p.id).find(m => m.kind === 'extra' || m.kind === 'postpaid');
const pname = p => p.guest ? p.guest + ' (손님)' : user(p.userId).name;

/* 환불 비율: 행사까지 남은 일수가 규칙의 'n일 전까지'를 만족하는 첫 구간의 비율 */
function refundRate(e, onDate){
  const left = daysBetween(onDate, e.date);
  const rules = [...e.rules].sort((a, b) => b.days - a.days);
  for (const r of rules) if (left >= r.days) return r.rate;
  return 0;
}
function ruleText(e){
  if (e.type !== 'prepaid') return '선납금 없음';
  const rs = [...e.rules].sort((a, b) => b.days - a.days);
  return (rs.length ? rs.map(r => `${r.days}일 전까지 ${r.rate}%`).join(' · ') + ' · 그 이후 환불 없음' : '환불 없음') + ' · 불참 시 환불 없음';
}

/* 정산 공식
   확보금 = 확인된 선납금 − 환불액
   부족분 = 총지출 − 확보금
   부족분 > 0 → 1인당 = 부족분 ÷ N (1원 미만 버림), 버림 차액은 회비 부담
   부족분 ≤ 0 → 추가금 없음, 남은 금액은 회비로 이월
   후불형은 확보금이 0이므로 1인당 = 총지출 ÷ N */
function calcSettlement(e, spent){
  const parts = partsOf(e.id);
  const attendees = parts.filter(p => isActive(p) && p.attended);
  const N = attendees.length;
  let confirmedSum = 0, refundSum = 0, paidCount = 0;
  if (e.type === 'prepaid'){
    parts.forEach(p => paysOf(p.id).forEach(m => {
      if (m.kind === 'prepaid' && m.confirmedAt){ confirmedSum += m.amount; paidCount++; }
      if (m.kind === 'refund') refundSum += m.amount;
    }));
  }
  const secured = confirmedSum - refundSum;
  const short = spent - secured;
  let per = 0, gap = 0, carry = 0;
  if (short > 0 && N > 0){ per = Math.floor(short / N); gap = short - per * N; }
  else if (short <= 0) carry = -short;
  const unpaidAtt = e.type === 'prepaid' ? attendees.filter(p => !prepaidOf(p)?.confirmedAt) : [];
  return {N, memberN:attendees.filter(p => p.userId).length, guestN:attendees.filter(p => p.guest).length,
          confirmedSum, refundSum, paidCount, secured, short, per, gap, carry, attendees, unpaidAtt};
}
function settleEvent(e, spent, by, date){
  const {attendees, unpaidAtt, ...c} = calcSettlement(e, spent);
  e.settlement = {...c, spent, by, at:date};
  if (c.per > 0) attendees.forEach(p => S.pays.push({id:uid('m'), partId:p.id, kind:e.type === 'prepaid' ? 'extra' : 'postpaid',
      amount:c.per, payer:null, reportedAt:null, confirmedAt:null, confirmedBy:null}));
  if (c.gap > 0) S.ledger.push({date, desc:`${e.name} · 1인당 금액 버림 차액`, amount:-c.gap});
  if (c.carry > 0) S.ledger.push({date, desc:`${e.name} · 남은 금액 이월`, amount:c.carry});
}

/* 늦은 출석 코드: 30초마다 바뀌는 6자리. 직전 코드까지만 인정(최대 1분)
   실제 앱에서는 secret을 서버만 알고, 검증도 서버에서 해야 함 */
const SLOT = 30000;
const slotNow = () => Math.floor(Date.now() / SLOT);
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); }
const lateToken = (eid, slot) => hashStr(`${eid}|${slot}|${S.secret}`);
const lateOpen = e => !!e.lateUntil && Date.now() < e.lateUntil;

function mark(p, method, by){ Object.assign(p, {attended:true, method, checkedBy:by || ui.persona, checkedAt:stamp()}); }
function unmark(p){ Object.assign(p, {attended:false, method:null, checkedBy:null, checkedAt:null}); }
function ensurePart(eid, userId){
  let p = partOf(eid, userId);
  if (p){ p.status = 'applied'; return p; }
  p = {id:uid('p'), eventId:eid, userId, guest:null, status:'applied', appliedAt:today(), attended:false, method:null,
       checkedBy:null, checkedAt:null, cancelReqAt:null, refundRate:null};
  S.parts.push(p); return p;
}

function checkLate(e, userId, code){
  if (!lateOpen(e)) return {ok:false, msg:'늦은 출석이 마감되었습니다. 운영진에게 직접 확인을 요청하세요.'};
  if (e.locked) return {ok:false, msg:'출석이 이미 확정되었습니다.'};
  const s = slotNow();
  if (code !== lateToken(e.id, s) && code !== lateToken(e.id, s - 1))
    return {ok:false, msg:'만료되었거나 잘못된 코드입니다. 운영진 화면에 지금 떠 있는 QR을 다시 찍어 주세요.'};
  let p = partOf(e.id, userId);
  if (!p || !isActive(p)){
    if (e.type !== 'postpaid') return {ok:false, msg:'이 행사에 신청하지 않았습니다.'};
    p = ensurePart(e.id, userId);
  }
  if (p.attended) return {ok:false, msg:'이미 출석 처리되어 있습니다.'};
  mark(p, 'late', userId);
  return {ok:true, msg:`출석했습니다 (${p.checkedAt.slice(11)}).`};
}

function doScan(e, code){
  if (e.locked) return {tone:'bad', msg:'출석이 확정되어 더 이상 체크할 수 없습니다.'};
  const userId = (code || '').replace('MOIM:', '');
  const u = user(userId);
  if (!u || !roleOf(userId)) return {tone:'bad', msg:'이번 학기 회원의 QR이 아닙니다.'};
  let p = partOf(e.id, userId);
  const who = `${u.name} (${u.sid})`;
  if (!p || !isActive(p)){
    if (e.type !== 'postpaid') return {tone:'bad', msg:`${who}: 이 행사에 신청하지 않은 회원입니다.`};
    p = ensurePart(e.id, userId); mark(p, 'qr');
    return {tone:'ok', msg:`${who}: 현장 참여로 명단에 추가하고 출석 처리했습니다.`};
  }
  if (p.attended) return {tone:'warn', msg:`${who}: 이미 ${p.checkedAt.slice(11)}에 출석했습니다.`};
  mark(p, 'qr');
  if (e.type === 'prepaid' && !prepaidOf(p)?.confirmedAt)
    return {tone:'warn', msg:`${who}: 출석 처리했지만 입금이 확인되지 않았습니다. 총무·회장에게 알려 주세요.`};
  return {tone:'ok', msg:`${who}: 출석 처리했습니다.`};
}

/* 확인 단계가 필요한 버튼: 한 번 누르면 질문이 나오고, '예'를 눌러야 실행 */

function myStatus(e, p){
  if (!p || p.status === 'cancelled') return {label:'미신청', tone:''};
  if (p.status === 'refunded') return {label:'환불 완료', tone:''};
  if (p.status === 'cancelRequested') return {label:'취소 요청 중', tone:'warn'};
  if (e.settlement){
    if (!p.attended) return {label:'불참', tone:''};
    const c = chargeOf(p);
    if (!c || c.confirmedAt) return {label:'정산 완료', tone:'ok'};
    if (c.reportedAt) return {label:'입금 확인 중', tone:'info'};
    return {label: e.type === 'prepaid' ? '추가금 미납' : '정산금 미납', tone:'bad'};
  }
  if (p.attended) return {label:'출석', tone:'ok'};
  if (e.type === 'prepaid'){
    const m = prepaidOf(p);
    if (!m) return {label:'입금 대기', tone:'bad'};
    return m.confirmedAt ? {label:'입금 확인', tone:'ok'} : {label:'입금 확인 중', tone:'info'};

  return {label:'참여 예정', tone:'info'};

function counts(){

           cancels: S.parts.filter(p => p.status === 'cancelRequested').length,

function tabList(r){

  t.push({id:'guide', label:'시연 순서'});
  return t;
}
function personaOptions(){

}

function mountQR(root = document){

    <p class="muted sm">'입금했어요'를 누른 뒤에는 직접 취소할 수 없고 취소 요청만 할 수 있습니다.</p>`);

function calcTable(e, c, spent){
  const L = [];
  if (e.type === 'prepaid'){
    L.push(['확인된 선납금', `${c.paidCount}건`, won(c.confirmedSum)]);
    if (c.refundSum) L.push(['환불', '취소 요청 승인분', '−' + won(c.refundSum)]);
    L.push(['확보금', '선납금 − 환불 (불참자 선납금 포함)', won(c.secured)]);
    L.push(['실제 총지출', '', won(spent)]);
    L.push([c.short > 0 ? '부족분' : '남은 금액', '총지출 − 확보금', won(Math.abs(c.short))]);
  } else L.push(['실제 총지출', '', won(spent)]);
  L.push(['정산 인원 N', e.type === 'prepaid' ? '확정된 출석자 (운영진 포함)' : `회원 ${c.memberN}명 + 손님 ${c.guestN}명`, c.N + '명']);
  let total;
  if (c.short > 0 && c.N > 0){
    L.push(['걷히는 금액', `${won(c.per)} × ${c.N}명`, won(c.per * c.N)]);
    L.push(['버림 차액', '회비에서 부담', c.gap ? '−' + won(c.gap) : '0원']);
    total = ['1인당 금액', `${won(c.short)} ÷ ${c.N} = ${(c.short / c.N).toLocaleString('ko-KR', {maximumFractionDigits:3})} → 1원 미만 버림`, won(c.per)];
  } else total = ['1인당 추가금', `선납금으로 충당, ${won(c.carry)} 회비로 이월`, '0원'];
  return `<div class="tbl calc"><table><tbody>${L.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}
    <tr class="total"><td>${total[0]}</td><td>${total[1]}</td><td class="num">${total[2]}</td></tr></tbody></table></div>`;
}
function settlePreview(e){
  const spent = parseInt(ui.spent[e.id], 10);
  if (!(spent > 0)) return `<p class="muted">총지출을 입력하면 계산 과정이 바로 나옵니다.</p>`;
  const c = calcSettlement(e, spent);
  if (!c.N) return `<p class="msg bad">출석자가 없어 정산할 수 없습니다.</p>`;
  const warn = c.unpaidAtt.length ? `<p class="msg warn">출석했지만 선납금 입금이 확인되지 않은 사람: ${c.unpaidAtt.map(p => esc(pname(p))).join(', ')}. 입금·환불 탭에서 먼저 확인하세요.</p>` : '';
  const q = c.per > 0 ? `1인당 ${won(c.per)}으로 확정할까요? 확정 후에는 바꿀 수 없습니다.` : `추가금 없이 ${won(c.carry)}을 이월할까요?`;
  return `<div style="display:grid;gap:10px;margin-top:6px">${warn}${calcTable(e, c, spent)}<div class="row">${confirmable('settle:' + e.id, '정산 확정', q, 'settleGo', {id:e.id})}</div></div>`;
}
function noticeText(e){
  const s = e.settlement, names = partsOf(e.id).filter(p => isActive(p) && p.attended).map(p => pname(p).replace(' (손님)', '(손님)'));
  const lines = [`[${e.name} 정산 안내]`];
  if (e.type === 'prepaid'){
    lines.push(`총지출 ${won(s.spent)} / 확보한 선납금 ${won(s.secured)}`);
    if (s.per > 0){
      lines.push(`부족한 ${won(s.short)}을 참석자 ${s.N}명이 나눕니다.`);
      lines.push(`1인당 추가금: ${won(s.per)}` + (s.gap ? ` (1원 미만 버림, 차액 ${won(s.gap)}은 회비에서 부담)` : ''));
    } else lines.push(`선납금으로 모두 충당되어 추가금은 없습니다. 남은 ${won(s.carry)}은 회비로 이월합니다.`);
  } else {
    lines.push(`총지출 ${won(s.spent)} ÷ ${s.N}명`);
    lines.push(`1인당: ${won(s.per)}` + (s.gap ? ` (1원 미만 버림, 차액 ${won(s.gap)}은 회비에서 부담)` : ''));
  }
  if (s.per > 0){ lines.push(`입금 계좌: ${S.settings.account}`); lines.push(`입금 후 앱에서 '입금했어요'를 눌러 주세요.`); }
  lines.push('', `대상자 (${names.length}명): ${names.join(', ')}`);
  return lines.join('\n');
}
function settleResult(e){
  const s = e.settlement;
  const charges = partsOf(e.id).flatMap(p => paysOf(p.id).filter(m => m.kind === 'extra' || m.kind === 'postpaid').map(m => ({m, p})));
  const paid = charges.filter(x => x.m.confirmedAt).length;
  return `<div class="tiles">
      <div class="tile"><span class="lbl">1인당</span><b>${won(s.per)}</b></div>
      <div class="tile"><span class="lbl">정산 인원</span><b>${s.N}명</b></div>
      <div class="tile"><span class="lbl">${s.carry ? '회비 이월' : '회비 부담 (버림 차액)'}</span><b>${s.carry ? '+' + won(s.carry) : s.gap ? '−' + won(s.gap) : '0원'}</b></div>
      <div class="tile ${charges.length - paid ? 'alert' : ''}"><span class="lbl">입금 확인</span><b>${paid}/${charges.length}</b></div></div>
    <p class="sm muted">${dlabel(s.at)} ${esc(user(s.by)?.name)} 확정</p>
    ${calcTable(e, s, s.spent)}
    <section class="card"><h3>카톡방 안내문</h3><p class="sm muted">복사해서 단톡방에 붙여 넣으세요. (카톡 자동 발송은 이후 단계)</p>
      <textarea id="notice" rows="8" readonly>${esc(noticeText(e))}</textarea><div class="row">${btn('안내문 복사', 'copy', {target:'notice'}, 'primary')}</div></section>
    ${charges.length ? `<h4>입금 현황</h4><ul class="plist">${charges.map(({m, p}) => `<li class="${m.confirmedAt ? 'is-in' : ''}"><div><b>${esc(pname(p))}</b><span class="mono sm">${won(m.amount)}</span>
      ${m.confirmedAt ? pill('확인', 'ok') : m.reportedAt ? pill('입금 표시함', 'info') : pill('미입금', 'bad')}</div>${m.confirmedAt ? '' : btn(p.guest ? '바로 확인 (손님)' : '확인', 'confirmPay', {id:m.id}, 'ghost sm')}</li>`).join('')}</ul>` : ''}`;
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
const findPart = id => S.parts.find(p => p.id === id);
const findPay = id => S.pays.find(m => m.id === id);
const showErr = (id, msg) => { const el = $('#' + id); el.textContent = msg; el.hidden = false; };

const ACT = {
  tab: d => { ui.tab = d.id; ui.eventId = null; ui.confirm = null; render(); },
  go: d => { ui.persona = d.persona; ui.tab = d.tab; ui.confirm = null; ui.scanMsg = null; ui.lateMsg = null; ui.eventId = null;
    if (d.tab === 'events' && d.ev) ui.eventId = d.ev;
    if (d.tab === 'attend' && d.ev){ ui.attEvent = d.ev; ui.attTab = ev(d.ev).type === 'postpaid' ? 'roster' : 'scan'; }

  openEvent: d => { ui.eventId = d.id; ui.confirm = null; ui.lateMsg = null; render(); scrollTo(0, 0); },
  back: () => { ui.eventId = null; render(); },
  ask: d => { ui.confirm = d.key; render(); },
  unask: () => { ui.confirm = null; render(); },
  copy: d => {
    const el = d.target ? $('#' + d.target) : null, text = el ? el.value : d.text;
    const fail = () => { if (el){ el.focus(); el.select(); toast('복사가 막혀 있어 내용을 선택해 두었습니다. Ctrl+C로 복사하세요.'); } else toast(text); };
    try { navigator.clipboard.writeText(text).then(() => toast('복사했습니다.'), fail); } catch(e) { fail(); }
  },

  // 학생
  apply: d => { const e = ev(d.id); const p = ensurePart(e.id, ui.persona); Object.assign(p, {appliedAt:today(), cancelReqAt:null, refundRate:null});

    if (S.users.some(u => u.sid === sid)) return showErr('su-err', '이미 계정이 있는 학번입니다. 위쪽 시연 인물에서 그 사람을 고르세요.');
    if (!$('#su-agree').checked) return showErr('su-err', '정보 수집에 동의해야 신청할 수 있습니다.');
    const u = {id:uid('u'), name, sid, dept:dept || '-', phone:phone || '-'};
    S.users.push(u); S.ms.push({userId:u.id, sem:CUR, role:'member', status:'pending', kakao:false, appliedAt:today()});
    ui.persona = u.id; toast(`${name}님 가입 신청이 접수되었습니다.`); render(); },

  // 운영진: 출석
  attTab: d => { ui.attTab = d.id; ui.scanMsg = null; render(); },
  scan: () => { ui.scanMsg = doScan(ev(ui.attEvent), $('#scanWho')?.value); render(); },
  toggleAttend: d => { const p = findPart(d.id), e = ev(p.eventId);
    if (e.locked) return toast('출석이 확정되어 고칠 수 없습니다.');
    p.attended ? unmark(p) : mark(p, d.m || 'search'); render(); },
  addMember: d => { const e = ev(ui.attEvent); if (e.locked) return; mark(ensurePart(e.id, d.uid), 'search'); toast(`${user(d.uid).name}님을 추가하고 출석 처리했습니다.`); render(); },
  headcount: () => { ui.headcount = $('#headcount').value; render(); },
  lateSet: d => { const e = ev(d.id), v = Date.parse($('#lateUntilIn').value);
    if (!(v > Date.now())) return toast('마감 시각은 지금보다 뒤여야 합니다.');
    e.lateUntil = v; toast(`늦은 출석 마감: ${timeLabel(v)}`); render(); },
  lateExtend: d => { const e = ev(d.id); e.lateUntil += 30 * 60000; toast(`마감을 ${timeLabel(e.lateUntil)}로 늦췄습니다.`); render(); },
  lateClose: d => { const e = ev(d.id); e.lateUntil = Date.now() - 1; toast('늦은 출석을 마감했습니다.'); render(); },
  importLinked: d => { const e = ev(d.id), L = ev(e.linked); let n = 0;
    activeParts(L.id).filter(p => p.attended && p.userId).forEach(lp => {
      const p = partOf(e.id, lp.userId); if (p && isActive(p) && p.attended) return;
      mark(ensurePart(e.id, lp.userId), 'import'); n++; });
    toast(n ? `${n}명을 불러왔습니다. 오지 않은 사람은 '빼기'를 누르세요.` : '새로 불러올 사람이 없습니다.'); render(); },
  addGuest: d => { const name = $('#guestName').value.trim(); if (!name) return toast('손님 이름을 입력하세요.');
    const p = {id:uid('p'), eventId:d.id, userId:null, guest:name, status:'applied', appliedAt:today(), attended:false, method:null, checkedBy:null, checkedAt:null, cancelReqAt:null, refundRate:null};
    mark(p, 'manual'); S.parts.push(p); toast(`손님 ${name}님을 추가했습니다.`); render(); },
  removePart: d => { const p = findPart(d.id); p.status = 'cancelled'; unmark(p); render(); },
  lockGo: d => { Object.assign(ev(d.id), {locked:true, lockedBy:ui.persona, lockedAt:stamp()}); ui.confirm = null; toast('출석을 확정했습니다. 정산 탭에서 정산할 수 있습니다.'); render(); },
  unlock: d => { Object.assign(ev(d.id), {locked:false, lockedBy:null, lockedAt:null}); toast('확정을 해제했습니다.'); render(); },

  // 운영진: 행사 등록
  addRule: () => { $('#f-rules').insertAdjacentHTML('beforeend', ruleRow(3, 0)); updateRulePreview(); },
  delRule: (d, t) => { t.closest('.rule-row').remove(); updateRulePreview(); },
  createEvent: () => {
    const name = $('#f-name').value.trim(), type = $('#f-post').checked ? 'postpaid' : 'prepaid', date = $('#f-date').value;
    if (!name) return showErr('f-err', '행사 이름을 입력하세요.');
    if (!date) return showErr('f-err', '행사 날짜를 고르세요.');
    const e = {id:uid('e'), name, type, date, fee:0, deadline:date, rules:[], linked:null, lateUntil:null, locked:false, lockedBy:null, lockedAt:null, settlement:null};
    if (type === 'prepaid'){
      e.fee = parseInt($('#f-fee').value, 10); e.deadline = $('#f-deadline').value; e.rules = readRules();
      if (!(e.fee > 0)) return showErr('f-err', '참가비를 입력하세요.');
      if (!e.deadline || e.deadline > date) return showErr('f-err', '신청 마감은 행사 날짜와 같거나 빨라야 합니다.');
      if (e.rules === null) return showErr('f-err', '환불 규칙의 일수와 비율(0~100)을 확인하세요.');
    } else e.linked = $('#f-linked').value || null;
    S.events.push(e); ui.tab = 'events'; ui.eventId = e.id; toast(`'${name}' 행사를 등록했습니다.`); render(); scrollTo(0, 0); },

  // 총무·회장
  confirmPay: d => { const m = findPay(d.id), p = findPart(m.partId);
    Object.assign(m, {confirmedAt:today(), confirmedBy:ui.persona, reportedAt:m.reportedAt || today(), payer:m.payer || pname(p)});
    toast(`${pname(p)} ${won(m.amount)} 입금을 확인했습니다.`); render(); },
  confirmSel: () => { const ids = [...document.querySelectorAll('input[data-pay]:checked')].map(c => c.dataset.pay);
    if (!ids.length) return toast('확인할 항목을 선택하세요.');
    ids.forEach(id => Object.assign(findPay(id), {confirmedAt:today(), confirmedBy:ui.persona})); toast(`${ids.length}건을 확인했습니다.`); render(); },
  approveCancel: d => { const p = findPart(d.id), pp = prepaidOf(p), amt = Math.floor(pp.amount * p.refundRate / 100);
    if (amt > 0){ S.pays.push({id:uid('m'), partId:p.id, kind:'refund', amount:amt, payer:null, reportedAt:null, confirmedAt:today(), confirmedBy:ui.persona}); p.status = 'refunded'; }
    else p.status = 'cancelled';
    toast(amt ? `${pname(p)}님에게 ${won(amt)} 환불 처리했습니다.` : `${pname(p)}님 취소를 처리했습니다 (환불 없음).`); render(); },
  rejectCancel: d => { Object.assign(findPart(d.id), {status:'applied', cancelReqAt:null, refundRate:null}); toast('취소 요청을 거절했습니다.'); render(); },
  pickSettle: d => { ui.settleEvent = d.id; ui.confirm = null; render(); },
  settleGo: d => { const e = ev(d.id), spent = parseInt(ui.spent[e.id], 10);
    if (!(spent > 0) || !calcSettlement(e, spent).N) return toast('총지출과 출석자를 확인하세요.');
    settleEvent(e, spent, ui.persona, today()); ui.confirm = null; toast('정산을 확정했습니다. 안내문을 복사해 단톡방에 올리세요.'); render(); },
  approveSel: () => { const ids = [...document.querySelectorAll('input[data-mem]:checked')].map(c => c.dataset.mem);
    if (!ids.length) return toast('승인할 사람을 선택하세요.');
    ids.forEach(id => Object.assign(mem(id), {status:'approved', kakao:false})); toast(`${ids.length}명을 승인했습니다. 카톡방에 초대해 주세요.`); render(); },
  rejectSel: () => { const ids = [...document.querySelectorAll('input[data-mem]:checked')].map(c => c.dataset.mem);
    if (!ids.length) return toast('거절할 사람을 선택하세요.');
    ids.forEach(id => mem(id).status = 'rejected'); toast(`${ids.length}명을 거절했습니다.`); render(); },
  kakao: d => { mem(d.uid).kakao = true; render(); },
  saveAcct: () => { S.settings.account = $('#acct').value.trim() || S.settings.account; toast('계좌를 저장했습니다.'); render(); },
  setToday: () => { S.settings.today = $('#demoToday').value || null; toast(`기준일을 ${dlabel(today())}로 바꿨습니다.`); render(); },
  resetToday: () => { S.settings.today = null; toast('실제 오늘 날짜로 돌아왔습니다.'); render(); },
  resetData: () => { seed(); ui = {...ui, persona:'u5', tab:'guide', eventId:null, attEvent:'e-oct', attTab:'scan', settleEvent:'e-oct', confirm:null, search:'', headcount:'', scanMsg:null, lateMsg:null, spent:{}};
    toast('시연 데이터를 처음 상태로 되돌렸습니다.'); render(); },
};

/* 입력이 바뀔 때 (선택 상자, 체크박스) */
const CHG = {
  persona: t => { ui.persona = t.value; ui.eventId = null; ui.confirm = null; ui.lateMsg = null; ui.scanMsg = null; render(); },
  attEvent: t => { ui.attEvent = t.value; ui.scanMsg = null; ui.search = ''; ui.headcount = ''; render(); },
  role: t => { mem(t.dataset.uid).role = t.value; toast(`${user(t.dataset.uid).name}: ${ROLE_LABEL[t.value]}`); render(); },
  selAll: t => document.querySelectorAll(`input[data-${t.dataset.group}]`).forEach(c => c.checked = t.checked),
  ftype: () => { const post = $('#f-post').checked;
    document.querySelectorAll('[data-pre]').forEach(el => el.hidden = post); document.querySelectorAll('[data-post]').forEach(el => el.hidden = !post); },
};
/* 글자를 입력할 때 (화면 전체가 아니라 필요한 부분만 다시 그림) */
const INP = {
  attSearch: t => { ui.search = t.value; $('#searchList').innerHTML = searchList(ev(ui.attEvent)); },
  spent: t => { ui.spent[ui.settleEvent] = t.value; if (ui.confirm) ui.confirm = null; $('#settlePreview').innerHTML = settlePreview(ev(ui.settleEvent)); },
  rules: () => updateRulePreview(),
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t); });
document.addEventListener('change', e => { const k = e.target.dataset?.change; if (k && CHG[k]) CHG[k](e.target); });
document.addEventListener('input', e => { const k = e.target.dataset?.input; if (k && INP[k]) INP[k](e.target); });
document.addEventListener('submit', e => { e.preventDefault(); const k = e.target.dataset.submit; if (k && ACT[k]) ACT[k](); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lateCode') ACT.lateCheckin({id:ui.eventId}); });

/* 1초마다: 늦은 출석 QR 남은 시간 표시, 30초마다 새 코드 */
setInterval(() => {
  const cd = $('#lateCountdown'); if (!cd) return;
  const e = ev(ui.attEvent);
  if (!lateOpen(e)){ render(); return; }
  cd.textContent = Math.ceil((SLOT - Date.now() % SLOT) / 1000) + '초';
  const s = slotNow();
  if (s !== ui.lastSlot){ ui.lastSlot = s; const q = $('#lateQR'); q.dataset.qr = `MOIM-LATE:${e.id}:${lateToken(e.id, s)}`; mountQR(q.parentNode); $('#lateCodeText').textContent = lateToken(e.id, s); }
}, 1000);

S = load() || seed();
if (!load()) ui.tab = 'guide';
render();
</script>

</body>
</html>
