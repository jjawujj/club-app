# main에 올라올 때마다 index.html을 안드로이드 앱(APK)으로 포장합니다.
# 결과 APK는 저장소의 Releases > "apk-latest"에서 내려받을 수 있습니다.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 앱 안에 넣을 웹 파일 준비. QR 라이브러리는 인터넷 없이도 되도록 앱 안에 포함
      - name: Prepare web files
        run: |
          mkdir -p www
          curl -fsSL -o www/qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#' index.html > www/index.html

      # Capacitor가 안드로이드 프로젝트를 만들고, Gradle이 APK를 빌드
      - name: Build APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../moimjangbu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moimjangbu-apk
          path: moimjangbu.apk

      # 휴대폰에서 바로 받을 수 있게 Releases에도 올림
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest moimjangbu.apk \
            --title "모임장부 APK (최신)" \
            --notes "main 브랜치 $(git rev-parse --short HEAD) 기준 자동 빌드. 휴대폰에서 moimjangbu.apk를 받아 설치하세요."
